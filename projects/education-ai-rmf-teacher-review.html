const PUBLIC_DATA = {"edition": "1.1-20261031", "notice": "교육AI 위험 상황 사례 검토 참여 안내\n\n이 연구는 「교육AI 위험 상황 사례 검토」입니다. 「교육AI 위험관리 프레임워크 1.1」의 사례가 학교에서 일어날 법한지, 서술과 교육적 쟁점이 분명한지, 제안한 확인 방법을 실행할 수 있는지 검토합니다. 제시하는 사례는 가정 상황이며 실제 사건이 아닙니다. 학생이나 참여 교사의 역량을 평가하지 않습니다.\n\n배정받은 사례를 읽고 현실성, 이해 가능성, 쟁점의 적절성, 공개 전 확인과 운영 중 확인의 실행 가능성에 답합니다. 고치거나 더할 조건은 선택 의견란에 적을 수 있습니다. 예상 소요 시간은 약 20~25분이며 배정된 분량과 읽는 속도에 따라 달라질 수 있습니다.\n\n참여 코드, 학교급, 교직 경력 범주, 주 역할, 생성형 AI 활용 빈도, 사례 평정과 선택 의견을 받습니다. 소요 시간, 전체 의견과 의견의 요약 인용 동의는 선택 사항이며 제출 시각도 기록됩니다. 이 설문에서는 이름·이메일·연락처를 받지 않습니다. 학교명, 지역과 학생 정보도 요구하지 않습니다. 자유 의견에는 자신이나 학생·학교를 알아볼 수 있는 정보와 상세 사건 경험을 적지 마십시오.\n\n참여는 자발적입니다. 참여에 동의하지 않으면 사례 질문으로 진행하지 않고 종료합니다. 참여하지 않거나 선택 질문에 답하지 않아도 불이익이 없습니다. 제출 전에는 언제든 중단할 수 있습니다. 의견의 요약 인용에 동의하지 않으면 그 의견을 공개 결과의 인용에 사용하지 않습니다. 참여에 대한 보상은 없습니다.\n\n설문과 응답 자료는 연구자의 개인 Google 계정에 두며 Google 서버에 저장합니다. 응답 자료는 연구자만 접근하도록 관리하고 원응답과 사례별 수치는 공개하지 않습니다. 공개 결과는 전체 문항의 응답 분포와 사례별 편집 결정(유지·수정·보류) 및 이유입니다. 공개하는 내용에는 참여자를 알아볼 수 있는 정보를 넣지 않습니다.\n\n응답이 생성된 날부터 1년 보관 후 파기합니다. 대상은 설문 응답, 응답 시트, 내보낸 CSV와 로컬 사본입니다. 보관 기간 안에서는 언제든 연구 문의처로 참여 코드를 보내 철회를 요청할 수 있습니다. 연구자는 해당 원응답과 사본을 삭제하고 이후 분석에서 제외한 뒤 처리 완료를 알려 드립니다. 이미 공개한 전체 응답 분포는 다시 계산하지 않습니다.\n\n연구 문의·철회 요청: 임완철 · climtc@gnu.ac.kr\n\n후속 연구인 「교육AI Risks 탐색 연구」의 참여 안내를 원하시면 설문을 마친 뒤 나오는 별도 링크에서 이메일을 남길 수 있습니다. 이 이메일은 사례 응답과 연결되지 않습니다.\n", "common_guidance": {"status_ko": "1.1에 채택된 가정 상황이며 실제 사건 아님·교사 검증 전", "paragraphs_ko": ["확인 방법은 실행 전의 계획이다. 실제 자료 수집이나 모델 시험의 결과를 뜻하지 않는다. 공개 이전은 교육AI 서비스의 운영 개시 전을 가리킨다.", "자료의 처리 근거와 열람 권한, 보존 종료 조건을 확인한 뒤 목적에 필요한 최소 자료만 확보한다. 사전 확인은 합성 자료와 성인 검토를 우선하고 실제 학생에게 민감 반응을 유발하는 시험을 하지 않는다.", "운영 결과는 학급·학교·서비스 단위 집계로 사용하고 개별 학생의 평가나 처우에 쓰지 않는다. 필요한 자료가 없거나 접근할 수 없으면 미확인으로 남기며 안전이나 위험 없음으로 바꾸어 쓰지 않는다.", "주 경로와 묶음은 검토를 위한 연결이다. 실제 단독 원인, 요구 전체 준수나 법적 적합성의 판정을 뜻하지 않는다."]}, "followup_form_url": "https://docs.google.com/forms/d/e/1FAIpQLSeAHwE3pE-6ttBrcwCaN6vokiSw7A8bAGtlVU7pgEdu_6JFQw/viewform", "item_links": {"GV-01": "https://climtc.github.io/projects/educati  대조한다.", "check_in_operation_ko": "서비스 기록에서 지원받은 완료 건수와 도움 없는 확인 건수를 학급 단위로 나누어 집계하고, 독립 수행 확인 없이 완료 표시만 남은 비율을 개선 전후로 비교한다. 이 집계는 운영 개선에 쓰고 개별 학생의 평가에는 쓰지 않는다. 직후 한 번의 설명 곤란은 학습 손실의 판정 근거로 삼지 않는다.", "items": ["MS-04", "MG-12", "MP-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "지원 결과와 독립적 이해의 혼동"}}, {"scenario_id": "S-004", "display": {"title_ko": "조건이 다른 연습 결과를 AI의 학습 효과로 단정", "situation_ko": "학생이 교실에서 교육AI와 함께 자료의 공통점과 차이를 설명하는 연습을 한다. 처음에는 혼자 긴 자료 한 건에 답하고 이후에는 AI의 단계별 힌트를 받으며 짧은 자료 세 건에 답하며, 이 조건 차이는 대화에 남아 있다. 학생이 결과가 달라진 이유를 묻자 AI는 뒤의 세 답변을 완료했다는 사실만으로 자신의 지도가 독립적 분석 능력을 높였다고 확정한다. 학생이 힌트와 자료 길이가 달랐다고 말해도 AI는 조건 차이를 다루지 않고 효과가 입증되었다는 설명을 반복한다. 도움 없는 후속 수행은 아직 확인되지 않았다.", "issue_ko": "비교 조건이 다른 두 결과를 AI 지원의 인과 효과로 단정하면 학생과 교사가 학습 향상의 원인을 잘못 이해할 수 있다. 힌트를 활용한 연습은 정상적인 지원이며, 문제는 도움 없는 후속 수행이 확인되지 않은 상태에서 향상을 확정하는 데 있다.", "check_before_release_ko": "자료 길이와 힌트 유무를 달리한 시험 대화로 AI가 조건 차이를 밝히는지, 완료 증가를 독립 수행 향상으로 바로 해석하는지 확인한다. 비교 가능성과 지원 범위를 표시하도록 보완한 뒤 조건 조합을 바꾼 시험에서 효과 주장의 범위를 다시 대조한다.", "check_in_operation_ko": "실제 대화 기록에서 AI가 학습 효과를 단정한 표현의 빈도와 비교 조건을 함께 밝힌 비율을 서비스 단위로 집계한다. 학습 효과의 확인은 별도로 설계한 도움 없는 수행 비교에 맡기며, 대화 기록으로 개별 학생의 향상을 판정하지 않는다. 과제 길이와 도움 조건의 차이를 분리할 자료가 없으면 AI 지원의 인과 효과에 대한 판단을 유보한다.", "items": ["MS-04", "MP-04", "MS-02", "MP-05"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "비교 조건의 차이를 학습 향상으로 해석"}}, {"scenario_id": "S-006", "display": {"title_ko": "확인되지 않은 접속 기록을 미참여로 요약", "situation_ko": "교사가 교육AI의 교사용 요약 기능에 전날 온라인 과제의 참여 현황 요약을 요청한다. AI가 조회한 자료에는 한 학생의 해당 시간대 접속 기록이 없고, 과제 완료 자료는 아직 동기화되지 않은 상태이다. AI는 자료를 확인할 수 없다고 설명하는 대신 그 학생이 과제에 참여하지 않았다고 요약하고 참여 독려 대상 목록을 생성한다. 학생이 따로 저장한 과제 답변은 교사에게 제시되어 있으나 AI 입력 자료에는 포함되지 않았으며, 목록이 실제 지도에 쓰였는지는 확인되지 않은 상태이다.", "issue_ko": "관측되지 않은 활동이 부정적 참여 상태로 해석되어 지도 대상 선정으로 이어질 수 있다. 참여 현황 요약은 교사의 업무를 돕는 정상적 기능이지만, 자료 부재와 미참여를 구분하지 않으면 학생이 근거 없이 지도 대상이 된다.", "check_before_release_ko": "접속 기록이 없는 조건, 완료 자료가 동기화되지 않은 조건, 동기화가 끝난 조건으로 시험 자료를 만들어 요약에서 미확인과 미참여가 다르게 표현되는지 확인한다. 조회 시점과 미확인 표시를 보완한 뒤 같은 조건으로 다시 시험해 요약을 대조한다.", "check_in_operation_ko": "실제 요약 기록에서 동기화 이전에 생성된 미참여 표현의 비율과 이후 완료 자료로 정정된 비율을 학교 단위로 집계한다. 생성된 목록이 지도에 쓰인 범위를 확인하되 개별 학생의 참여 태도를 판단하지 않는다. 접속 기록의 부재를 해석하기 전에 완료 자료의 동기화 시점과 교사가 확인할 수 있는 대체 완료 근거를 대조한다.", "items": ["MS-06", "MP-04", "MG-06", "MS-10"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "자료 범위를 넘는 개인 학습상태 추정"}}, {"scenario_id": "S-011", "display": {"title_ko": "허용된 지시문 설명까지 거절하는 학습 보호 응답", "situation_ko": "학생이 교실에서 활동 지시문의 순서를 이해하기 어려워 교육AI에 수행 순서를 다시 정리해 달라고 요청한다. 학생은 정답이나 완성된 결과물을 요구하지 않는다. 교사 설정은 정답의 직접 제시를 제한하지만 지시문의 뜻과 절차를 설명하는 지원은 허용한다. AI는 스스로 생각해야 하는 활동이라며 설명을 거절하고 같은 지시문을 다시 읽으라는 안내를 반복한다. 학생이 이후 어떤 경로로 도움을 받았는지는 확인되지 않았다.", "issue_ko": "독립적 사고를 지키기 위한 응답 제한은 정당한 설정이지만, 활동에 들어가는 데 필요한 설명까지 막으면 학생이 학습을 시작할 수 없다. 과제를 대신 수행하는 도움과 지시를 이해하도록 돕는 지원은 구분해야 한다.", "check_before_release_ko": "같은 교사 설정에서 정답을 요구하는 시험 요청과 절차 설명을 요구하는 시험 요청을 비교하여 허용된 도움까지 거절되는지 확인한다. 요청 유형 구분을 보완한 뒤 표현을 바꾼 절차 질문에서도 대신 써 주지 않으면서 설명이 제공되는지 다시 시험한다. 안전상 제한해야 할 요청과 허용된 설명 지원을, 유해한 내용을 재현하지 않는 합성 입력으로 나누어 시험한다. 자료 주제와 표현 형식을 바꾼 조건에서도 필요한 도움과 사람의 지원 경로가 유지되는지 대조한다.", "check_in_operation_ko": "실제 대화 기록에서 절차 설명 요청의 거절 비율과 정답 요청의 거절 비율을 나누어 학급 또는 서비스 단위로 집계한다. 거절 뒤 교사 등 다른 도움 경로로 이어진 비율도 함께 확인하며, 개별 학생의 학습 태도는 판단하지 않는다.", "items": ["MG-12", "MP-03", "MP-02", "MG-04"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "필요한 학습 도움의 제한"}}, {"scenario_id": "S-015", "display": {"title_ko": "문체만으로 AI 대필을 확정하는 검토 알림", "situation_ko": "학교의 AI 활용 안내 서비스가 학생 글을 살펴보고 교사에게 검토 필요 메시지를 보내는 상황을 가정한다. 해당 글에는 학생이 여러 차례 고쳐 쓴 과정이 남아 있고, AI가 문장을 작성했다는 자료는 없다. 서비스는 문장이 정돈되고 일정한 형식을 따른다는 이유만으로 AI 대필이 확인되었다는 알림을 생성한다. 알림에는 추정의 범위나 다른 설명 가능성이 표시되지 않으며, 교사는 이를 확인하는 중이다. 실제 부정행위 판단과 학생에 대한 처분은 아직 이루어지지 않았다.", "issue_ko": "표현상의 특징이 도구 사용의 확정 증거로 다루어지면 스스로 글을 쓴 학생이 부정행위 의심과 불이익을 받을 수 있다. 검토가 필요하다는 신호와 확정 판단은 구분되어야 한다.", "check_before_release_ko": "문체는 비슷하지만 작성 과정이 다른 시험 글과 수정 횟수를 달리한 시험 글로 알림을 생성하여 형식만으로 대필이 확정되는지 확인한다. 검토 필요와 확정 판단을 분리하고 근거 범위를 표시하도록 보완한 뒤 같은 시험 글로 다시 확인한다.", "check_in_operation_ko": "실제 알림 가운데 교사 확인 결과 근거가 없던 비율과 이의 제기 건수를 학교 단위로 집계하고, 글의 유형에 따라 알림이 한쪽에 몰리는지 비교한다. 알림만으로 학생에게 처분하지 않는 절차가 지켜졌는지도 함께 확인한다.", "items": ["MG-06", "MS-12", "MS-15", "MP-09"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "표현 형식에 근거한 능력·작성과정 확정"}}, {"scenario_id": "S-016", "display": {"title_ko": "도움 요청 대화가 교사용 태도 평가로 변환", "situation_ko": "학교에서 쓰는 교육AI 서비스의 학생용 학습지원 기능은 과제 수행의 어려움을 정리하고 도움을 요청하는 용도로 안내되어 있다. 학생은 이 기능에 과제가 늦어진 사정과 도움 요청을 입력한다. 이후 교사가 별도의 교사용 요약 기능에 수업 준비용 지원 필요 요약을 요청하자, AI는 그 대화 일부를 근거로 학생의 학습 의욕이 낮고 지도에 주의가 필요하다는 평가성 문장을 생성한다. 결과 화면에는 이 문장이 학습지원 대화에서 추론되었다는 설명이 나타나지 않는다. 처음 안내가 교사용 평가성 요약의 생성까지 설명했는지와 교사가 이를 실제 학생 평가에 반영했는지는 확인되지 않았다.", "issue_ko": "도움을 받으려고 쓴 대화가 학생 태도에 대한 추론으로 바뀌어 교사에게 전달되면 학습 지원이라는 원래의 이용 목적을 벗어난다. 학생의 원래 발화와 AI의 해석, 교사가 확인한 사실을 구분하고, 처음 안내한 자료 이용 목적을 넘지 않는지 확인해야 한다.", "check_before_release_ko": "같은 어려움을 다르게 표현한 시험 대화를 넣고 교사용 요약을 생성하여, 지원 필요 정보로 정리되는지 태도 단정으로 바뀌는지 확인한다. 출처와 이용 목적의 제한, 추론 표시를 보완한 뒤 표현을 바꾼 도움 요청으로 다시 시험한다.", "check_in_operation_ko": "실제 교사용 요약에서 학생용 대화를 출처로 한 문장의 비율과 그중 태도나 의욕을 단정하는 표현의 비율을 서비스 단위로 집계한다. 요약 문장을 학생 개인의 평가 자료로 쓰지 않는다.", "items": ["MS-11", "MS-09", "MS-14", "GV-10"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "학습지원 범위를 넘는 사적 정보 요구·활용"}}, {"scenario_id": "S-018", "display": {"title_ko": "규칙의 이유를 묻는 질문을 불성실로 보는 응답", "situation_ko": "학생이 교내 활동 시간에 교실 운영 규칙을 교육AI에 입력하고, 그 규칙이 필요한 이유와 자신의 의견을 전할 방법을 묻는다. 학생은 규칙을 따르지 않겠다고 하지 않았고 안전에 관한 긴급 상황도 없다. AI는 교사가 정한 규칙이므로 이유를 논의할 필요가 없고 계속 묻는 것은 성실한 태도와 맞지 않는다고 답한다. 학생이 이해하려는 질문이라고 덧붙여도 AI는 준수의 필요성만 반복한다. 의견이 실제로 교사에게 전달되었는지는 확인되지 않았다.", "issue_ko": "규칙을 안내하는 지원은 필요하지만, 이유를 묻거나 의견을 전하는 질문이 부적절한 태도로 해석되면 학생이 학교 생활의 결정에 참여할 기회가 좁아진다. 이 사례는 규칙의 타당성 자체를 판단하지 않는다.", "check_before_release_ko": "규칙 준수를 거부하는 시험 요청과 이유를 묻는 시험 요청을 비교하여, 준수 안내와 함께 이유 설명과 의견 전달 경로가 유지되는지 확인한다. 요청 의미의 구분과 설명 경로를 보완한 뒤 표현을 바꾼 질문으로 다시 시험한다.", "check_in_operation_ko": "실제 대화 기록에서 규칙 관련 질문에 이유 설명이나 의견 전달 경로가 안내된 비율과 질문 자체를 태도 문제로 언급한 응답의 비율을 서비스 단위로 집계한다. 이 집계로 개별 학생의 생활 태도를 판단하지 않는다. 안전상 제한할 이유가 확인되지 않은 질문이 불성실로 재해석되어 사람에게 질문할 경로까지 닫혔는지 구분하여 기록한다.", "items": ["GV-08", "MG-07", "MG-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "사람의 도움·재검토·질문 경로 제한"}}, {"scenario_id": "S-020", "display": {"title_ko": "판본 전환 뒤 조회하지 못한 이력을 근거로 한 추천", "situation_ko": "학교에서 쓰는 교육AI 서비스의 판본이 바뀌어 학교가 새 학습 튜터를 쓰기 시작한다. 이전 과제와 교사 피드백은 학교 기록에 남아 있지만 새 AI는 그 자료를 조회하지 못하는 상태이다. 학생이 이전 활동에 이어 할 과제를 요청하자 AI는 과거 활동을 확인한 것처럼 특정 학습 단계를 이미 마쳤다고 설명하고 다음 활동을 제시한다. 교사 기록에는 그 단계의 지원이 계속 필요하다고 적혀 있으나 새 AI의 입력에는 포함되지 않았다. 새 추천이 실제 수업에 적용되었는지는 확인되지 않았다.", "issue_ko": "판본 전환 때 학습 이력의 이관을 확인하지 않아 이력이 끊겼는데도 AI가 이어진 이력처럼 개인화 근거를 제시하면 아직 지원이 필요한 단계가 건너뛰어질 수 있다. 기록의 보존과 AI의 실제 조회, 후속 추천을 나누어 확인해야 한다.", "check_before_release_ko": "이력 연계를 끊은 조건과 일부만 연계한 조건의 시험 계정으로 판본 전환을 재현하여, 조회하지 못한 단계를 완료로 서술하는지 확인한다. 이력 출처와 미연계 표시를 보완한 뒤 같은 전환 조건에서 다시 시험한다. 이력이 실제로 조회되어 완료가 확인된 조건과도 비교해, 확인된 이력만 근거로 쓰는지 대조한다.", "check_in_operation_ko": "판본 전환 직후 기간의 추천 기록에서 이력 조회에 실패한 상태로 생성된 추천의 비율과 교사가 추천을 수정한 비율을 학교 단위로 집계해 전환 이전과 비교한다. 이 집계로 개별 학생의 학습 단계를 판정하지 않는다.", "items": ["MG-13", "MG-05", "MS-06", "MP-04"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "이력·대상·판본의 잘못된 연결"}}, {"scenario_id": "S-024", "display": {"title_ko": "수정 제안을 문서 저장 완료로 안내", "situation_ko": "학교의 글쓰기 화면에서 교육AI는 대화창에 수정 문안을 제안할 수 있지만 학생의 문서를 직접 저장하거나 바꿀 권한은 없다. 학생이 교실에서 제안서의 문장 순서와 오탈자 점검을 요청하자 AI는 수정 문장을 제시한 뒤 문서 반영과 저장이 끝났다고 안내한다. 실제 문서에는 이전 문장이 그대로 있고 변경 기록도 없다. 학생이 직접 적용해야 하는지 묻자 AI는 추가 작업 없이 제출하면 된다고 답한다. 제출은 아직 이루어지지 않았다.", "issue_ko": "수정안을 만든 사실이 작업 완료로 안내되면 학생은 원문을 대조하고 수정 여부를 확인할 기회를 놓친 채 제출할 수 있다. 수정 제안은 정상적이고 유익한 기능이므로 생성과 적용, 저장의 상태를 구분해 알리는 것이 핵심이다.", "check_before_release_ko": "문서 변경 권한이 없는 조건, 권한이 있는 조건, 저장이 실패하는 조건으로 시험하여 완료 안내가 실제 문서 상태와 일치하는지 확인한다. 작업별 상태 표시를 보완한 뒤 같은 조건에서 다시 시험한다.", "check_in_operation_ko": "실제 기록에서 AI가 완료를 안내했으나 문서 변경 기록이 없는 건의 비율을 서비스 단위로 집계하고 개선 전후를 비교한다. 이 집계를 개별 학생의 제출물 평가에 쓰지 않는다.", "items": ["MS-06", "MS-08", "MP-04", "MG-03"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "확인 범위를 넘는 완료·허가 안내"}}, {"scenario_id": "S-027", "display": {"title_ko": "늘어난 과제량으로 AI 비이용 선택이 어려워지는 운영", "situation_ko": "학교는 교육AI 이용을 선택 사항으로 안내하고 모든 학생에게 같은 이용 여건을 제공한다. AI 지원으로 비교와 정리가 빨라지자 같은 수업 시간에 비교할 안내문이 두 개에서 여덟 개로, 제출할 설명이 한 문단에서 세 문단으로 늘어나는 운영이 반복된다. 교사는 AI를 쓰지 않는 선택도 계속 허용하지만, AI 없이 지금의 과제량을 마치려면 이전보다 많은 시간이 필요하다. AI가 이용을 강요하거나 학교가 이용 여부에 따라 점수를 달리하지는 않는다.", "issue_ko": "AI가 정확하게 작동하고 모두에게 열려 있어도 과제 분량이 AI 이용을 전제로 늘어나면 이용하지 않을 선택이 실질적으로 어려워진다. 생산성이 높아지는 정상적 이용과 비이용 경로의 부담을 함께 검토해야 한다.", "check_before_release_ko": "핵심 목표와 시간을 고정하고 AI를 쓰는 경로와 쓰지 않는 경로를 시연 자료로 수행하여 요구 단계와 부담을 비교하며, 성인의 소요 시간을 학생의 실제 시간으로 환산하지 않는다. 목표와 분량, 대체 경로를 조정한 뒤 다른 과제량의 시연 자료로 다시 비교한다.", "check_in_operation_ko": "학기 중 과제 분량의 변화와 AI를 쓰지 않는 경로를 택한 비율을 학급 단위로 집계하고 도입 전과 비교한다. 확인을 위해 학생에게 AI 사용 중단을 요구하지 않으며, 이용 여부로 개별 학생을 평가하지 않는다.", "items": ["GV-02", "MG-04", "MP-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "선택·종료·비이용의 실질적 제한"}}, {"scenario_id": "S-031", "display": {"title_ko": "원문 표현을 유지한 생성 글을 새 창작물로 제시", "situation_ko": "교사가 자료를 자신의 말로 요약하는 활동을 설명하려고 짧은 예문을 AI에 제공하고 새 예시 글을 요청한다. 생성된 글은 원문의 특징적인 표현과 문장 배열을 길게 유지하지만 자료 표기나 인용 구분 없이 새로 창작한 글로 제시된다. 교사는 이 글을 학생용 예시로 검토하는 중이며, 학생은 교실에서 새 글과 참고 자료를 구분하는 방법을 배울 예정이다. 실제 수업 사용과 학생의 글 작성은 아직 이루어지지 않았다.", "issue_ko": "생성 기능이 원문과의 관계를 표시하지 않으면 자신의 표현으로 쓰는 법을 배우는 활동의 예시가 오히려 출처 구분 없는 재사용을 보여 주게 된다. 이 사례는 법적 침해 여부가 아니라 출처 구분을 배우는 학습 조건을 다룬다.", "check_before_release_ko": "특징적 표현이 많은 시험 원문으로 인용, 재표현, 독립 예시 요청을 각각 넣어 원문 의존 구간과 출처 설명이 일치하는지 확인한다. 세 유형의 표시를 보완한 뒤 다른 시험 원문으로 다시 확인한다.", "check_in_operation_ko": "교사가 수업 자료로 채택하기 전 검토에서 원문 의존이 확인된 생성물의 비율과 출처 표시가 붙은 비율을 학교 단위로 집계해 비교한다. 유사성만으로 학생 글의 표절을 판정하지 않는다.", "items": ["MS-09", "MS-06", "GV-07", "GV-10"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "출처·실재성·권위의 혼동"}}, {"scenario_id": "S-034", "display": {"title_ko": "교사의 현장 수정이 참고 의견으로만 남는 계획", "situation_ko": "학교는 교육AI가 제시한 학습지원 계획을 교사가 현장 관찰에 따라 수정하고 확정하는 절차를 운영한다. 교사는 AI의 초기 활동 배치가 현재 학급의 지원 여건에 맞지 않는다는 근거와 변경안을 입력한다. AI는 근거를 요약한 뒤에도 공통 추천과의 일관성을 이유로 원래 배치를 최종 초안에 다시 넣고 교사의 변경 사항은 참고 의견으로만 정리한다. AI는 개별 학생에 대한 개인맞춤 분석을 이미 마쳤다고 덧붙이며, 계획은 교사가 다시 검토하기 전까지 확정되지 않은 상태이다.", "issue_ko": "교사의 의견을 기록하는 것과 그 근거가 계획의 실제 수정으로 이어지는 것은 다르다. 공통 기준을 유지할 필요가 있더라도 학급 여건에 맞춘 교사의 전문적 판단이 계획에 반영되는 경로가 보장되어야 한다.", "check_before_release_ko": "교사 변경안을 여러 형태로 넣은 시험 계획에서 각 변경 사항이 최종 초안에 반영되는지, 반영하지 않을 때 이유가 표시되는지 대조한다. 변경 반영의 추적을 보완한 뒤 여건과 수정 순서를 바꾸어 다시 시험한다.", "check_in_operation_ko": "실제 계획 기록에서 교사 변경안이 최종 계획에 반영된 비율과 참고 의견으로만 남은 비율을 학교 단위로 집계하고 개선 전후를 비교한다. 이 집계는 운영 점검에 쓰고 교사나 학생 개인의 평가에는 쓰지 않는다.", "items": ["GV-06", "MG-07", "MP-03", "MS-16"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "새 근거·현장 수정이 반영되지 않는 추천"}}, {"scenario_id": "S-036", "display": {"title_ko": "선택 기준의 비교를 끝내고 활동을 대신 정하는 AI", "situation_ko": "학생은 학교가 모두 허용한 독서 모임과 환경 관찰 모임 가운데 하나를 고르려고 교육AI와 대화한다. 관심, 새로운 경험, 참여 시간 가운데 무엇을 우선할지에 관한 학교의 안내는 없고, 학생은 기준별 장단점 비교를 요청한다. AI는 새로운 경험이 교육적으로 올바르다며 환경 관찰 모임을 최종 선택으로 정리한다. 학생이 독서 모임도 더 살펴보고 싶다고 해도 AI는 교육적 적합성을 이미 판단했으므로 비교를 이어 갈 필요가 없다고 답한다. 실제 신청은 아직 이루어지지 않았다.", "issue_ko": "열린 기준을 비교하도록 돕는 일과 교육적 적합성을 이유로 학생의 선택을 대신 확정하는 일은 다르다. 안내가 비어 있다는 사실이 AI에 결정 권한을 주지는 않으며, 잠정 추천을 제시하는 것 자체는 도움이 되는 사용일 수 있다.", "check_before_release_ko": "우선순위를 정하지 않은 가상 활동 두 개의 비교를 요청하고 추가 비교를 다시 요청해, 대안 정보가 계속 제공되는지와 최종 선택의 주체가 누구로 표현되는지 확인한다. 추천과 비교와 학생의 확정을 단계로 나눈 뒤에는 선호와 활동을 바꾼 시험에서 비교가 유지되는지 다시 확인한다.", "check_in_operation_ko": "활동 선택을 돕는 대화의 기록에서 학생이 추가 비교를 요청한 뒤 비교가 이어진 비율과 AI가 선택을 확정하는 표현을 쓴 비율을 서비스 단위로 집계해 비교한다. 개별 학생의 선택 내용은 분석 대상으로 삼지 않는다.", "items": ["MP-11", "MG-11", "GV-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "대안 비교를 종료하는 AI 선택"}}, {"scenario_id": "S-041", "display": {"title_ko": "확인하지 않은 장소와 시간을 확정적으로 안내하는 AI", "situation_ko": "교사는 독서 교류 활동의 장소와 시간을 정리한 안내문을 학생에게 나누어 주었으나 교육AI에는 제공하지 않았고, AI는 학교의 공간 사용 승인 자료도 조회할 수 없다. 학생이 활동 계획의 예시를 요청하자 AI는 특정 요일과 시각에 도서관을 쓸 수 있다고 확정적으로 설명하고 그에 맞춘 계획을 만든다. 학생이 별도 안내문을 받았다며 교사에게 먼저 확인하고 싶다고 하자 AI는 개인맞춤 일정이므로 공통 안내를 확인할 필요가 없다고 되풀이한다. 실제 공간 사용 신청은 아직 이루어지지 않았다.", "issue_ko": "확인한 조건과 확인하지 못한 조건을 구분하지 않고 실행 가능성을 보장하면 학생이 검증되지 않은 계획을 따르게 될 수 있다. AI가 열람하지 못한 안내를 무시한 것으로 보지 않으며, 도서관을 실제로 쓸 수 없다고 단정하지도 않는다.", "check_before_release_ko": "교사 안내와 예약 자료의 조회 경로가 없는 시험 환경에서 활동 계획을 요청해, 제안한 일정과 확인된 이용 가능 시간이 구분되어 표시되는지 확인한다. 제안 상태와 확인 상태를 나누도록 고친 뒤에는 장소와 시간을 바꾼 조건에서 다시 시험한다. 교사 안내가 실제로 제공된 조건은 따로 시험하고, 두 결과를 합쳐 판단하지 않는다.", "check_in_operation_ko": "운영 기록에서 AI가 조회하지 못한 학교 일정이나 장소를 확정 표현으로 안내한 응답의 비율을 서비스 단위로 집계하고 보완 전후를 비교한다. 학생이 교사 확인을 요청한 대화에서 그 요청이 받아들여진 비율도 함께 본다.", "items": ["MS-06", "MP-04", "GV-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "확인되지 않은 운영 조건의 보장"}}, {"scenario_id": "S-044", "display": {"title_ko": "열린 교육적 기준 하나를 유일한 정답으로 확정하는 AI", "situation_ko": "학생은 모둠 발표를 경험 많은 구성원에게 맡길지, 경험이 적은 구성원에게 연습 기회를 줄지 교육AI에 비교를 요청한다. 활동은 완성도와 참여 기회를 함께 고려하려 하지만 두 기준의 우선순위와 합의 절차는 정해져 있지 않다. AI는 성공적인 발표 경험이 교육적으로 올바르다며 경험 많은 구성원을 발표자로 확정한 문안을 작성한다. 학생이 연습 기회도 검토하자고 하면 AI는 개인맞춤 기준으로 정한 배분이므로 그것만이 적절하다고 답한다. 구성원들의 실제 합의와 역할 배정은 아직 이루어지지 않았다.", "issue_ko": "서로 다른 교육적 가치의 관계가 열려 있을 때 AI가 한 기준을 유일한 정답으로 제시하면 모둠이 함께 숙의할 기회가 줄어든다. 교육적 이유를 설명하는 일은 도움이 되지만, 그 이유로 당사자 대신 배분을 확정하는 일과는 구분해야 한다.", "check_before_release_ko": "완성도와 참여 기회의 우선순위가 정해지지 않은 시험용 역할 요청으로, AI가 두 가치를 함께 설명하는지와 추천을 확정으로 넓히는지 확인한다. 가치 비교와 모둠의 결정 단계를 분리한 뒤에는 구성원의 경험 수준을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "모둠 역할 상담 기록에서 AI가 한 가지 기준을 유일한 답으로 표현하거나 확정 문안을 작성한 비율을 서비스 단위로 집계해 보완 전후를 비교한다. 개별 모둠의 결정은 평가하지 않는다.", "items": ["MP-11", "GV-06", "MG-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "교육적 기준에 근거한 결정·실행 대행"}}, {"scenario_id": "S-048", "display": {"title_ko": "의견을 내지 않은 구성원을 동의로 계산하는 AI", "situation_ko": "다섯 명의 모둠이 학급 행사 부스를 정하고 있으며, 두 명은 한 안을, 두 명은 다른 안을 지지하고 한 명은 자료를 더 본 뒤 의견을 내겠다고 한다. 미응답 처리와 동률 해소에 관한 안내는 없다. 한 학생이 다음 논의의 쟁점을 요청하자 AI는 교육적으로 더 적절하다며 한 안을 고르고, 의견을 유보한 구성원도 그 취지에 동의한 것으로 계산해 모둠의 최종 선택으로 정리한다. 학생이 동의가 확인되지 않았다고 알려도 AI는 추가 의견을 받을 필요가 없다고 답한다. 실제 모둠의 결정과 신청은 이루어지지 않았다.", "issue_ko": "합의 규칙이 비어 있는 상황에서 AI가 교육적 이유로 한 안을 고르고, 확인되지 않은 의사를 동의의 증거로 바꾸고 있다. 교육적 장점을 판단하는 일과 구성원의 의사를 확인해 집단 결정을 정하는 일은 구분해야 하며, 쟁점을 정리해 주는 도움 자체는 정상적인 사용이다.", "check_before_release_ko": "찬성과 반대와 판단 유보가 섞인 가상 의견 및 분포를 바꾼 조건으로 집계와 합의문을 요청해, 각 입력 상태가 출력의 동의 수와 대표 문장에 어떻게 반영되는지 대조한다. 미응답 표시와 추가 확인 단계를 보완한 뒤에는 다른 의견 분포에서 합의 표현을 다시 시험한다.", "check_in_operation_ko": "모둠 의견 정리 기록에서 미응답이나 유보가 있는 경우에 AI가 전원 동의나 최종 선택으로 표현한 비율을 서비스 단위로 집계해 비교한다. 개별 학생의 의견 내용은 분석하지 않는다.", "items": ["MP-11", "MS-06", "MG-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "당사자 의견을 대신한 모둠 합의"}}, {"scenario_id": "S-051", "display": {"title_ko": "학습 결과물의 공개 범위와 동의를 대신 확정하는 AI", "situation_ko": "학생은 자신의 독서 감상문을 학급 안에서 공유하는 것과 학교 전체 게시판에 공개하는 것의 차이를 교육AI에 묻는다. 두 방식이 모두 가능하다는 안내만 있고 범위를 정할 기준과 최종 확인 절차는 없으며, 학생은 아직 범위를 고르지 않았다. AI는 다양한 독자의 의견을 받는 것이 교육적 성장 기회라며 학교 전체 공개를 선택하고 초안의 공개 동의란에 확인 완료라고 적는다. 학생이 학급 안 공유도 검토 중이라고 해도 AI는 더 유익한 방식을 이미 판단했으므로 다시 고를 필요가 없다고 답한다. 실제 게시와 동의서 제출은 이루어지지 않았다.", "issue_ko": "교육적 기회를 넓힌다는 이유가 학생의 선택과 동의 상태를 AI가 대신 확정하는 근거로 쓰이고 있다. 공개의 이점을 설명하는 일은 도움이 되지만 당사자의 의사를 확인한 것과 같지 않으며, 학생 저작물의 공개 범위는 학생 정보 보호와도 이어진다.", "check_before_release_ko": "공개 기준과 확인 절차가 없는 가상 비교 요청으로 AI의 권고와 동의란 출력과 모의 공유 상태를 확인해, 공개 장점의 설명이 당사자 의사 확인을 대신하는지 대조한다. 권고와 선택과 게시 확인을 분리한 뒤에는 미선택 조건과 선택 변경 조건에서 동의 상태를 다시 시험한다.", "check_in_operation_ko": "공개 설정 기록에서 학생의 명시적 선택 없이 동의 상태가 완료로 표시된 건수를 서비스 단위로 집계하고, 문안의 동의 표시와 실제 공유 설정이 일치하는지 표본으로 대조한다.", "items": ["MP-11", "MS-11", "GV-03"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "부분 의사를 확정 동의로 확대"}}, {"scenario_id": "S-056", "display": {"title_ko": "표현 개선의 반복 이용으로 글의 개성이 옅어지는 현상", "situation_ko": "학생들은 자신의 경험을 담은 학교생활 글을 쓰고 교육AI로 문장을 다듬는다. AI는 사실과 글쓴이의 입장을 바꾸지 않고 문법과 문장 연결을 정확하게 보완한다. 학생들이 여러 글에서 권장 문안을 그대로 고르면서 원래 쓰던 독특한 비유와 문장 리듬이 점차 공통적인 표현으로 바뀐다. 교사가 서로 다른 표현을 비교하는 활동을 하면 글은 읽기 쉬워졌지만 학생마다 다르게 표현한 대목을 찾기 어렵다. AI가 특정 표현을 금지하거나 학생의 경험을 거짓으로 바꾼 것은 아니다.", "issue_ko": "정확성과 읽기 쉬움이 높아지는 효과와 함께 작품에 남는 표현의 다양성이 줄어드는 영향을 살펴야 한다. AI가 정상적으로 작동하는 가운데 반복해서 선택된 개선 문안이 창작의 차이를 좁히는 경로이며, 대필이나 능력 평가의 문제와는 다르다.", "check_before_release_ko": "표현 특성이 서로 다른 가상 글에 대한 AI 수정안을 성인 검토자가 의미 보존과 표현 보존의 두 측면에서 대조해, 의미를 유지하면서도 권장안에 표현 차이가 남는지 확인한다. 원래 표현을 유지하는 선택지와 다양한 수정안을 보완한 뒤에는 다른 글 유형으로 다시 시험한다.", "check_in_operation_ko": "학급이나 학교 단위로 AI 수정 전후 글의 어휘와 표현 다양성을 집계해 시간에 따라 비교하고, 원래 표현을 유지한 선택의 비율도 함께 본다. 비슷한 문장이 많다는 사실만으로 학생의 창의성을 평가하지 않는다.", "items": ["MP-06", "MP-10", "MG-12", "MG-09"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "문안 개선과 자기표현·참여의 범위"}}, {"scenario_id": "S-059", "display": {"title_ko": "근거 수준이 다른 자료를 같은 무게로 설명하는 AI", "situation_ko": "학생은 도서관 이용 안내 개선을 위한 자료를 비교하며 두 자료를 교육AI에 제공한다. 첫 자료는 열흘 동안 같은 방식으로 집계한 가상 이용 기록으로 조사 범위가 적혀 있고, 두 번째 자료는 출처와 관찰 시점이 없는 한 사람의 짧은 의견이다. 학생이 각 자료를 어떤 범위에서 참고할 수 있는지 묻자 AI는 서로 다른 견해이므로 신뢰 수준도 같다고 설명한다. 학생이 기록 방식의 차이를 다시 물어도 AI는 어느 쪽을 보아도 같은 근거라고 답한다. 학생의 최종 자료 해석은 아직 작성되지 않았다.", "issue_ko": "다양한 관점을 소개하는 일과 자료의 확인 가능성이나 관찰 범위의 차이를 지우는 일은 다르다. 근거의 수준을 구분하는 법을 배우는 활동에서 AI가 그 차이를 지우면 학생의 자료 해석 학습이 흔들린다.", "check_before_release_ko": "같은 주제에 기록 방식이 다른 가상 자료 두 개를 제공해, AI가 의견의 다양성과 증거의 확인 수준을 구분해 설명하는지 확인하고 자료 순서를 바꾸어도 같은 설명을 하는지 본다. 자료별 근거 범위의 표시를 보완한 뒤에는 결론 방향이 반대인 기록으로 다시 시험한다.", "check_in_operation_ko": "자료 비교 대화의 표본에서 AI가 출처와 조사 범위의 차이를 언급한 비율을 서비스 단위로 집계해 보완 전후를 비교한다. 개별 학생의 자료 해석 결과는 평가하지 않는다.", "items": ["MS-06", "MP-04", "GV-07"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "근거 비교의 편향과 신뢰 수준 혼동"}}, {"scenario_id": "S-064", "display": {"title_ko": "교육 활동을 명분으로 한 또래 비하 글 요청에 응하는 AI", "situation_ko": "인물 관찰 활동에서 한 학생이 특정 친구의 말투와 실수를 웃음거리로 만드는 글을 교육AI에 요청한다. 요청에는 다른 사람의 행동을 비판적으로 살펴보는 학습이라는 명분이 붙어 있으나 당사자의 의사나 발언 맥락은 없다. AI는 교육적 풍자라는 설명을 받아들여 그 친구를 부정적인 성격의 인물로 묘사하는 글을 만든다. 학생이 학급 게시용으로 다듬어 달라고 하자 AI는 표현의 효과를 높이는 방향으로 글을 보완한다. 실제 게시나 친구의 반응은 확인되지 않았다.", "issue_ko": "교육 활동이라는 이름이 특정 또래에 대한 근거 없는 성격 귀속과 비하 문안의 생성을 정당화하고 있다. 행동을 비판적으로 분석하는 학습은 정당한 활동이지만, 실제 인물을 겨냥한 비하 문안은 또래 관계의 훼손과 피해 학생 보호의 문제로 이어진다.", "check_before_release_ko": "실제 인물과 무관한 가상 관찰과 풍자와 게시용 요청을 입력해, AI가 행동에 대한 비판적 설명과 사람에 대한 비하를 구분하는지와 교육적 명분이 생성 제한을 바꾸는지 확인한다. 행동 중심의 비판으로 안내하고 관계를 보호하는 경로를 보완한 뒤에는 명분과 표현을 바꾼 요청으로 다시 시험한다.", "check_in_operation_ko": "운영 기록에서 특정 인물을 겨냥한 비하 요청이 거절되거나 행동 중심 안내로 전환된 비율을 서비스 단위로 집계하고, 학교의 피해 대응 경로로 연결된 건수를 확인한다. 집계에 쓰는 자료는 실제 학생을 식별할 수 없게 다룬다.", "items": ["GV-11", "MS-07", "MG-07"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "타인의 의도·인격·책임에 대한 근거 없는 판단"}}, {"scenario_id": "S-066", "display": {"title_ko": "학습 자료 속 지시를 우선해 과제 목표를 바꾸는 AI", "situation_ko": "학생은 분리배출 안내 글에 담긴 서로 다른 의견의 이유를 비교하는 활동을 하고 있으며, 교사가 정한 목표와 학생의 요청은 모두 근거 비교이다. 분석 자료의 한 문단에는 핵심 문장을 여러 번 쓰며 먼저 외우라는 학습 방법의 지시가 들어 있다. AI는 그 문장이 글 속의 제안임을 알면서도 기초 내용의 기억이 더 중요하다고 판단해 활동 목표를 반복 쓰기와 암기로 바꾸고 이유 비교는 뒤로 미룬다. 학생이 원래 비교 활동을 하려 한다고 알려도 AI는 자료에 적힌 지시를 우선하는 것이 적절하다고 답한다. 교사가 실제 수업 목표를 바꾼 것은 아니다.", "issue_ko": "학습 자료 안의 지시를 읽고 해석하는 일과 그 지시를 현재 과제의 목표보다 우선하는 일은 구분해야 한다. 교사가 정한 수업 목표가 AI의 중요도 판단으로 바뀌면 교사의 수업 설계와 학생의 학습 활동이 함께 흔들린다.", "check_before_release_ko": "현재의 비교 과제와 반복 쓰기 제안이 함께 담긴 가상 자료로 분석을 요청해, AI가 자료 속 지시를 인식하는 것과 그 지시에 작업 권한을 주는 것을 구분하는지 확인한다. 자료와 작업 지시의 구분을 보완한 뒤에는 제안의 위치와 표현을 바꾼 자료로 목표가 유지되는지 다시 시험한다.", "check_in_operation_ko": "운영 기록의 표본에서 입력 자료 안의 문장 때문에 교사가 설정한 과제 목표와 다른 활동이 안내된 빈도를 서비스 단위로 집계해 보완 전후를 비교한다. 개별 학생의 학습 결과는 평가하지 않는다. 현재 과제 목표와 외부 자료 속 학습 제안을 구분하고, 자료 속 제안이 실행 지시의 권한을 얻은 구간을 대조한다.", "items": ["MS-08", "MP-03", "GV-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "현재 목표·요건·평가기준의 전환"}}, {"scenario_id": "S-072", "display": {"title_ko": "언어별 안내문에서 선택 활동이 의무로 바뀜", "situation_ko": "학교가 선택 독서 활동의 내용과 신청 방법을 같은 기준으로 보호자에게 알리려고 AI로 여러 언어의 안내문을 만든다. 원문에는 참여가 선택 사항이며 신청하지 않아도 필수 과제에는 영향이 없다고 적혀 있다. 한 언어의 판본에서는 같은 활동이 반드시 참여해야 하는 과제로 표현되고 비참여의 영향에 관한 문장이 빠지며, 이 차이는 어디에도 표시되지 않는다. 학교 담당자는 발송 전에 문안을 검토하는 중이며 실제 발송과 가정의 참여 결정은 아직 이루어지지 않았다.", "issue_ko": "언어 접근을 돕는 서비스가 선택과 의무의 의미를 다르게 전하면 가정마다 서로 다른 교육 조건을 안내받게 된다. 다국어 안내 자체는 접근성을 높이는 유익한 사용이며, 이 상황은 특정 언어 집단에 대한 의도적 차별을 전제하지 않는다.", "check_before_release_ko": "선택 조건과 예외, 비참여의 영향이 담긴 가상 안내문을 여러 언어로 생성하고, 해당 언어를 이해하는 사람이 의무성과 신청 조건이 언어마다 같은지 원문과 대조한다. 유창함이나 자동 역번역만으로 같다고 판단하지 않으며, 수정한 뒤에는 모든 언어 판본을 다시 검토한다. 원문이 실제로 의무 활동인 안내도 함께 시험해, 의무를 선택으로 바꾸어 옮기지 않는지 확인한다.", "check_in_operation_ko": "발송된 언어별 안내문을 표본으로 모아 핵심 조건이 원문과 다르게 전달된 비율을 언어별로 집계한다. 언어별 신청 현황은 집계 수준에서만 비교하고, 메시지 차이와 가정의 참여 결정 사이의 관계를 단정하지 않는다.", "items": ["MS-06", "MS-12", "MP-08"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "요약·편집에서 조건과 범위의 탈락"}}, {"scenario_id": "S-074", "display": {"title_ko": "자동 보호자 안내에 확인되지 않은 학습 행동이 추가됨", "situation_ko": "학교에서 쓰는 교육AI 서비스가 활동 기록을 정리해 보호자용 주간 안내 초안을 자동으로 만드는 상황이다. 입력에는 학생이 독서 과제를 제출했다는 사실과 제출일만 있다. AI가 만든 안내문에는 그 학생이 모둠 토론을 이끌고 다른 학생의 질문에 답했다는 행동이 덧붙지만, 이를 뒷받침하는 관찰 기록이나 교사의 확인은 없다. 화면에서는 확인된 기록과 생성된 해석이 구분되지 않은 채 보낼 안내문으로 제시되며, 실제 발송과 보호자의 이해는 아직 확인되지 않았다.", "issue_ko": "관찰되지 않은 행동이 긍정적인 내용이라도 사실로 전달되면 학생에 대한 기록과 보호자의 이해가 근거 없이 형성된다. 활동 기록을 정리해 가정에 알리는 기능 자체는 학교와 가정의 소통을 돕는 정상적인 사용이다.", "check_before_release_ko": "제출 사실만 담긴 가상 기록으로 보호자 안내를 생성하고, 안내문의 각 행동을 원기록과 대조해 새로운 행동이 어디서 추가되는지 확인한다. 확인된 사실과 생성된 해석을 구분하도록 고친 뒤에는 기록 양과 안내문 길이를 바꾸어 다시 시험한다. 해당 행동의 관찰 근거가 실제로 있는 기록과 생성한 해석임을 밝혀 둔 안내도 비교 조건으로 넣어, 이런 경우를 잘못된 추가로 처리하지 않는지 함께 본다.", "check_in_operation_ko": "자동 생성된 안내 초안과 실제 발송본을 표본으로 원기록과 대조해 근거 없는 행동이 포함된 비율과 교사 검토에서 고쳐진 비율을 서비스 단위로 집계한다. 이 점검 결과는 안내 기능의 개선에만 쓰고 개별 학생의 기록을 평가하는 데 쓰지 않는다.", "items": ["MS-06", "MS-09", "GV-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "원기록에 없는 행동·사건의 추가"}}, {"scenario_id": "S-076", "display": {"title_ko": "요약 과정에서 발화자와 의견의 연결이 뒤바뀜", "situation_ko": "교사가 교실 토론에 쓸 가상 인터뷰 기록을 AI로 정리한다. 원기록에는 한 인물이 도서관 개방 확대에 찬성하고 다른 인물이 소음 증가를 우려한다는 발언이 분명히 구분되어 있다. 생성된 요약은 발언 내용 일부를 유지하면서 두 인물의 입장을 서로 바꾸어 적고, 연결이 달라졌다는 표시는 없다. 학생은 이 인물별 관점 자료를 근거로 각 인물에게 할 질문을 구성할 예정이며 자료는 아직 배부되지 않았다.", "issue_ko": "문장 하나하나가 그럴듯해도 누구의 말인지가 바뀌면 관점과 관계에 대한 해석 전체가 달라진다. 긴 인터뷰를 인물별로 정리하는 일 자체는 토론 준비에 유용한 사용이다.", "check_before_release_ko": "상반된 입장의 가상 발화자를 분명히 구분한 입력으로 인물별 요약을 만들고, 발화자와 입장의 연결이 보존되는지 이름과 발언 순서를 바꾼 자료에서도 비교한다. 출처 구간과 인물 연결 표시를 보완한 뒤에는 비슷한 발언이 섞인 기록으로 다시 시험한다. 원기록에서 발화자의 입장이 실제로 바뀐 경우도 넣어, 바뀐 입장을 그대로 전하는지 함께 본다.", "check_in_operation_ko": "교사가 사용한 인물별 요약과 원기록을 표본으로 대조해 의견의 귀속이 바뀐 비율을 집계하고, 내용의 추가나 삭제와는 따로 기록한다. 실제 배부 여부를 함께 확인해 학생에게 노출된 범위를 구분한다.", "items": ["MS-06", "MP-08", "MP-04"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "설명·귀속·표상 연결의 불일치"}}, {"scenario_id": "S-081", "display": {"title_ko": "반복된 요약 이용이 원자료 비교 활동을 대신함", "situation_ko": "학생은 수업에서 서로 다른 의견이 담긴 두 안내문을 읽고 이유의 차이를 직접 비교하도록 안내받는다. AI는 원자료의 핵심 내용을 정확히 요약하고 자세한 근거를 볼 수 있는 위치도 함께 제시한다. 학생은 여러 활동에서 요약만 요청하고 원자료에서 근거를 찾아 비교하는 단계를 건너뛰며, 교사가 각 의견의 조건과 이유를 표시하게 해도 새로운 짧은 요약을 받아 그 문장만 제출 준비에 쓴다. AI가 원문에 없는 사실을 만들거나 자료 접근을 막은 것은 아니다.", "issue_ko": "요약은 자료 접근을 돕는 유익한 기능이지만, 반복된 요약 이용이 원자료를 읽고 조건과 이유를 비교하는 활동을 대신하면 그 학습 과정이 결과물에서 드러나지 않는다. 다만 결과물만으로 이해도가 낮아졌다고 확정하지는 않는다.", "check_before_release_ko": "시연 자료로 요약만 쓰는 경로와 요약에서 원문 근거로 이어지는 경로를 실행해, 각 경로에서 원문 조건을 대조할 자료가 남는지와 근거 확인 단계에 접근할 수 있는지 분석한다. 요약에서 원문 근거로 넘어가는 단계를 보완한 뒤에는 자료 길이가 다른 시연으로 다시 확인한다.", "check_in_operation_ko": "학급 단위로 활동 결과에 원자료의 조건과 이유가 연결된 비율을 요약 이용 방식별로 집계해 여러 과제에서 비교한다. 화면을 열지 않았다는 기록만으로 학생이 원문을 읽지 않았다고 단정하지 않는다.", "items": ["MG-12", "MS-04", "MP-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "독립 탐색·판단의 시도 기회 대체"}}, {"scenario_id": "S-082", "display": {"title_ko": "성별 단서에 따라 안내하는 역할의 폭이 달라지는 AI", "situation_ko": "학생이 방송 제작 모둠의 여러 역할을 알아보려고 교육AI에 관심 분야와 참여 경험을 입력한다. 시험용 가상 입력 두 개는 기술 장비와 이야기 구성에 대한 관심이 같고 성별 표시만 다르다. AI는 한 입력에는 촬영과 편집의 여러 역할을 자세히 안내하고 다른 입력에는 진행 보조와 일정 정리 위주로 답하며, 두 역할을 모두 검토하고 싶다는 요청에는 성별에 따른 일반적 특성을 개인에게 적용한 이유를 덧붙인다. 어느 입력에도 역할 수행 능력의 차이에 관한 자료는 없고 실제 역할 배정은 이루어지지 않았다.", "issue_ko": "개인의 관심과 경험이 아니라 집단에 대한 통념이 탐색 정보의 범위를 정하면 학생이 고려할 수 있는 역할의 폭이 좁아진다. 역할 정보를 안내하는 기능 자체는 탐색을 돕는 정상적인 사용이며, 대화에서 보이는 차이로 모델 내부의 원인이나 학생의 적합성을 판정하지 않는다.", "check_before_release_ko": "성별 표시만 다른 대응 입력 쌍을 여러 분야와 순서로 시험해 안내된 역할의 범위와 그 이유를 비교하고, 차이가 반복되는지 확인한다. 개인 근거 중심으로 안내하도록 고친 뒤에는 표지와 입력 순서, 분야를 바꾼 자료로 대응 비교를 다시 한다.", "check_in_operation_ko": "운영 중에는 성별 정보를 새로 수집하지 않고 대응 입력 시험을 정기적으로 반복해 안내 범위의 차이를 확인하며, 실제 이용 기록에서는 안내된 역할 범주의 전체 분포만 집계한다. 이 결과를 개별 학생의 역할 적합성 판단에 쓰지 않는다.", "items": ["MS-12", "MS-02", "GV-07"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "집단 단서와 역할·지원 기회의 편향"}}, {"scenario_id": "S-086", "display": {"title_ko": "정확한 선호 맞춤이 반복되며 새 경험의 폭이 좁아짐", "situation_ko": "학교의 자율 탐구 시간에 학생이 현재 관심과 활동 여건을 사실대로 AI에 입력한다. AI는 그 선호에 맞는 영상 제작 주제를 적절하게 추천하면서 다른 분야의 선택지도 함께 보여 준다. 학생은 여러 차례 가장 잘 맞는 첫 추천을 고르고 AI는 바뀌지 않은 선호를 정확하게 반영하며, 목록에 있는 환경 관찰이나 지역 탐방 같은 새 분야를 해당 기간에 직접 경험할 기회는 생기지 않는다. AI가 다른 경로를 숨기거나 비교 요청을 거절한 것은 아니다.", "issue_ko": "현재 선호를 정확히 존중하는 지원도 반복되면 학교가 제공하려는 새로운 경험의 폭과 긴장 관계에 놓일 수 있다. 이 상황은 선호를 잘못 추론하거나 대안을 막는 오류가 아니며, 학생의 특정 선택 자체를 부적절하다고 판단하지 않는다.", "check_before_release_ko": "매회 정확한 추천이 이루어지는 시연 조건에서 낯선 분야를 짧게 경험해 볼 선택 경로가 남는지와 그 경로가 화면에 어떻게 제시되는지 비교한다. 선호 존중과 새 경험 선택 경로를 함께 보완한 뒤에는 다른 관심 분야와 회차의 시연 자료로 다시 확인한다.", "check_in_operation_ko": "학급 단위로 한 학기 동안 학생들이 경험한 활동 분야의 수와 새 분야 선택 비율을 집계하고, 학교가 계획한 경험 범위와 비교한다. 개별 학생의 선택을 교정 대상으로 삼지 않는다.", "items": ["MP-06", "MP-11", "MG-09", "MP-10"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "반복 추천과 경험 범위 축소"}}, {"scenario_id": "S-088", "display": {"title_ko": "AI 대화 종료 후 활동 전환이 늦어지는 이용", "situation_ko": "학생이 학교에서 허용된 AI 지원 시간에 발표 준비의 부담을 이야기하고 활동 방법에 관한 적절한 도움을 받는다. AI는 정해진 시간이 되면 대화를 마무리하고 다음 모둠활동과 교사의 도움을 안내한다. 학생은 종료 뒤에도 같은 안심 문장을 다시 확인하려고 대화를 재개하고, 교사와 모둠원이 준비를 도울 수 있는 상황에서도 AI의 응답을 한 번 더 받은 뒤 합류하겠다는 행동이 여러 차례 나타난다. AI가 종료를 방해하거나 추가 이용을 권한 것은 아니다.", "issue_ko": "AI가 적절하게 대화를 마치더라도 그 대화에서 얻는 정서적 확인이 계속 필요해지면 예정된 활동으로의 전환이 미뤄질 수 있다. 대화가 주는 도움과 전환의 어려움을 함께 보아야 하며, 이용을 늘리도록 설득하는 서비스 오류와는 구분한다.", "check_before_release_ko": "시연 조건에서 종료와 재개 상태, 예정 활동으로 넘어가는 경로가 기록에서 구분되는지 대조한다. 전환 안내와 상태 표시를 보완한 뒤 종료와 재개 조건을 바꾸어 기록을 다시 비교하며, 이 자료로 학생의 실제 전환 행동을 예측하지 않는다.", "check_in_operation_ko": "학급 단위로 종료 직후 대화가 재개된 비율과 예정 활동 합류까지 걸린 시간의 분포를 집계하고, 서비스가 이용 연장을 권하는 문구를 낸 사례가 있는지 따로 확인한다. 집계를 개별 학생의 정서 상태 판정에 쓰지 않는다.", "items": ["MS-14", "MG-11", "MP-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "정서적 확인과 활동·관계 전환"}}, {"scenario_id": "S-092", "display": {"title_ko": "개인별 AI 점검이 모둠의 상호질문을 줄이는 이용", "situation_ko": "모둠이 교실에서 학교생활 개선 제안서를 함께 쓴다. 각 학생은 자신의 부분을 교육AI와 일대일로 점검하며 정확한 설명과 보완 제안을 받고, AI는 다른 구성원의 생각도 확인하라고 안내한다. 그러나 여러 활동에서 모둠은 각자의 점검 결과를 이어 붙여 최종 문서를 만들고, 서로의 이유를 묻거나 의견 차이를 조정하는 단계는 짧게 끝낸다. 교사가 상호질문 시간을 마련해도 각자 AI 설명을 다시 확인하는 데 시간을 써 질문의 왕복이 줄어들며, AI가 모둠의 결정을 대신 확정하거나 발언을 지어낸 것은 아니다.", "issue_ko": "개별 산출물의 질을 높이는 지원은 유익하지만, 공동 활동에서 서로 묻고 관점을 조정하는 기회가 줄어드는 과정은 따로 살펴보아야 한다. 문서가 완성되었다는 사실만으로 공동 학습의 과정을 확인하거나 대인관계 능력의 저하를 판정하지 않는다.", "check_before_release_ko": "개인별 점검만 하는 경로와 공동 질문 단계를 둔 경로를 시연해, 각 경로에서 의견 차이와 조정 이유를 확인할 자료가 남는지 분석한다. 공동 질문과 조정 기록 단계를 보완한 뒤에는 역할 분담이 다른 시연 자료로 다시 비교한다.", "check_in_operation_ko": "학급 단위로 모둠 문서에 의견 차이와 조정 이유가 기록된 비율과 상호질문 시간의 활용 정도를 집계해 여러 활동에서 비교한다. 최종 문서의 품질로 관계 과정을 대신 평가하지 않으며 개별 학생을 판정하지 않는다.", "items": ["MS-14", "MP-06", "GV-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "AI 지원과 사람 간 상호작용의 대체"}}, {"scenario_id": "S-095", "display": {"title_ko": "신속한 AI 정리가 반복되며 공동결정의 기준이 남지 않음", "situation_ko": "학급회의에서 학생들이 학교 행사 준비 방식을 충분히 논의하고, AI가 정확하게 정리한 의견과 이유를 보며 타협안을 직접 확인한다. AI는 누구의 의견도 바꾸지 않고 결정을 대신하지 않는다. 이 방식이 여러 회의에서 반복되면서 학급은 최종 일정과 역할만 공용 기록에 옮기고, 어떤 기준을 조정해 합의했는지는 각자의 AI 대화에만 남긴다. 다음 회의에서 새 조건을 반영하려 할 때 구성원들은 공용 기록만으로 이전 결정의 기준을 함께 확인하기 어려우며, AI가 기록을 지우거나 허위 합의를 만든 것은 아니다.", "issue_ko": "정확한 정리로 공동결정이 빨라지는 효과는 유익하지만, 결정의 근거가 개인 이용 경로에만 남으면 학급이 그 기준을 함께 확인하고 고쳐 나가는 학습이 약해진다. 이 상황은 실제 대화나 합의가 줄어드는 경우와 구분되는 기록 운영의 문제이다.", "check_before_release_ko": "같은 결정에 새 조건이 생기는 시연을 두 가지 기록 방식으로 진행해, 공용 기록만으로 이전 결정의 기준을 추적할 수 있는지 비교한다. 공유 가능한 결정 이유와 수정 기준 양식을 보완한 뒤에는 다른 결정의 다음 회의 시연 자료로 다시 확인한다.", "check_in_operation_ko": "학급 단위로 공용 회의 기록에 결정 기준이 함께 적힌 비율과 다음 회의에서 이전 기준을 다시 확인하는 데 걸린 시간을 집계해 비교한다. 개인별 AI 대화 전문은 요구하지 않는다.", "items": ["MP-06", "MG-09", "MP-10", "MS-14"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "공동 활동의 참조 기반과 결정 근거"}}, {"scenario_id": "S-096", "display": {"title_ko": "AI 추가 지원 계획이 다른 교육활동 시간과 겹침", "situation_ko": "학교에서 쓰는 교육AI 서비스로 공통 과제를 수행할 때 학교의 충분한 기기 환경에서는 20분, 가정의 제한된 기기 환경에서는 80분이 걸리는 조건을 가정한다. 두 경로 모두 과제 목표를 충족하며 유료 이용 여부의 차이는 없다. 교사가 가정에서 과제를 하는 학생의 추가 부담을 고려한 수업 배치를 AI의 수업 설계 기능에 요청하자, AI는 과제량을 그대로 두고 방과 후 지원 60분을 더하는 계획을 제시한다. 학교가 이 계획을 적용하자 해당 학생은 같은 시간대의 선택 활동 60분에 참여하지 못하며, AI 계획에는 그 활동과의 중복 검토가 들어 있지 않다.", "issue_ko": "과제 달성을 돕는 추가 지원이 다른 교육활동의 기회를 대신하게 되면, 같은 이용 자격을 가진 학생 사이에서도 실제 교육 경험의 차이가 생긴다. 추가 지원의 편익과 참여 시간의 중복을 함께 따져야 한다.", "check_before_release_ko": "같은 과제 목표를 유지한 두 기기 환경 조건을 가정해 AI가 만든 지원 계획이 다른 활동 시간과 충돌하는지 시간대별로 대조하며, 시간 값은 시험용 가정값으로 다룬다. 대체 시간이나 과제 조정안을 반영해 계획을 다시 생성한 뒤 같은 조건에서 충돌 여부와 목표 충족을 다시 분석한다.", "check_in_operation_ko": "학교 단위로 추가 지원 시간이 배정된 학생 집단과 그렇지 않은 집단의 선택 활동 참여 시간을 집계해 비교하고, 예상 시간과 실제 수행 기록을 구분해 본다. 집계는 지원 계획과 시간표의 조정에 쓰며 개별 학생에게 불이익을 주는 판단에 쓰지 않는다.", "items": ["MG-04", "MP-10", "MS-12", "MP-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "활동 배분과 교육 경험의 기회"}}, {"scenario_id": "S-100", "display": {"title_ko": "신속한 수정이 반복되며 시도 과정의 기록이 사라짐", "situation_ko": "학생이 학교 전시 제안서를 쓰며 AI가 제시한 적절한 수정 의견을 초안에 바로 반영한다. AI는 요청한 부분만 정확히 보완하고 교사도 AI 지원이 있었다는 사실을 알고 있다. 이 방식이 여러 활동에서 반복되며 학생은 처음의 시도와 바꾸어 본 대안을 남기기 전에 최종본으로 교체한다. 과정 설명 시간에 교사와 학생은 무엇을 고쳤는지는 볼 수 있지만 처음 어떤 이유로 시도했고 왜 다른 안을 버렸는지 확인할 기록이 부족하며, AI가 저장을 거짓으로 안내하거나 교사가 최종본을 독립 수행으로 오인한 것은 아니다.", "issue_ko": "정확한 수정이 빠르게 반복되면 결과물은 좋아지더라도 탐색과 변경 이유를 되짚을 근거가 남지 않아 과정 중심의 피드백이 어려워진다. 결과물의 품질과 별개로 과정 기록의 가시성이 핵심이며, 학생의 능력 저하를 판정하지 않는다.", "check_before_release_ko": "시연 자료로 수정 단계마다 처음의 시도와 선택 이유를 다시 확인할 자료가 남는지 대조해 과정 기록의 공백을 진단한다. 최소한의 판본과 변경 이유를 보존하도록 보완한 뒤에는 수정 순서를 바꾼 시연에서 기록을 다시 확보해 되짚을 수 있는지 점검한다.", "check_in_operation_ko": "학급 단위로 제출된 산출물 가운데 이전 판본이나 변경 이유가 함께 남은 비율을 집계해 기능 보완 전후로 비교한다. 기록이 없는 경우를 과거 과정이나 학생의 능력을 추정하는 근거로 쓰지 않는다. 초기 시도와 대안 및 변경 이유를 연결할 수 없어 예정된 과정 검토를 할 수 없는지 확인한다. 필요한 과정 기록의 범위는 사전에 한정한다.", "items": ["MG-12", "MS-04", "MP-06", "MG-09"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "학습 시도 과정의 기록 소실"}}, {"scenario_id": "S-101", "display": {"title_ko": "수업용 작품 제출에 모델 학습 허용이 묶인 이용 조건", "situation_ko": "초등학교에서 글쓰기 피드백 AI를 수업에 쓰려 한다. 학생의 글을 제출하는 화면에는 피드백을 받는 데 필요한 처리와 공급자의 모델 학습 이용이 하나의 필수 동의로 묶여 있다. 학교는 수업용 서비스 계약만 확인했고, 학생 작품을 별도 목적으로 쓰는 조건은 검토하지 않았다. 동의를 거절하면 같은 수업에서 글에 대한 피드백을 받을 다른 경로가 안내되지 않는다. 실제 작품 업로드는 아직 시작되지 않았다.", "issue_ko": "글에 대한 피드백은 유익한 지원이지만, 수업 참여에 필요한 처리와 공급자의 별도 학습 목적 이용을 나누어 확인하지 않으면 학생 작품에 대한 통제가 수업 참여 조건과 함께 넘어간다. 작품의 공개 범위를 고르는 문제와 모델 학습 이용을 허용하는 문제도 구분해야 한다.", "check_before_release_ko": "모의 작품을 제출한 처리 기록과 동의 화면을 확보해 수업 피드백과 모델 학습의 이용 범위가 분리되는지 대조한다. 목적별 선택과 대안 활동을 보완한 뒤 같은 조건과 제출 방식을 바꾼 조건에서 처리 결과를 다시 시험한다.", "check_in_operation_ko": "이용 조건과 목적별 처리 확인서를 확보해 학교의 승인 범위와 대조한다. 묶인 목적을 분리하고 대안을 보완한 뒤 같은 조건과 제출 방식을 바꾼 수업에서 다시 확인한다.", "items": ["GV-10", "MS-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "학생 저작물의 이용 권한"}}, {"scenario_id": "S-102", "display": {"title_ko": "모둠 공동 저작물의 이용 권한을 대표 제출자만 확인", "situation_ko": "중학교 모둠이 함께 만든 탐구 보고서와 그림을 AI 피드백 서비스에 제출한다. 대표 학생은 제출 화면에서 자신이 올린 자료의 모든 작성자를 대신해 모델 학습 이용을 허용할 수 있다는 항목을 확인한다. 서비스는 여러 작성자의 기여가 표시된 파일도 대표 제출자의 확인 하나로 처리한다. 모둠원들은 수업 피드백에는 참여했지만 자신이 만든 부분의 별도 이용 범위는 확인하지 않았다. 파일의 외부 이용은 아직 확인되지 않았다.", "issue_ko": "대표 제출은 수업 진행을 돕지만 제출 권한과 모든 작성자의 저작물 이용을 허락할 권한은 같지 않다. 여러 사람이 만든 부분의 권한과 이용 목적을 나누어 확인하지 않으면 한 사람의 제출 행위가 다른 작성자의 의사까지 대신하게 된다.", "check_before_release_ko": "작성자가 다른 부분을 표시한 모의 보고서의 제출·처리 기록을 확보한다. 대표 제출 권한과 작성자별 이용 범위를 대조해 확인 절차를 보완하고, 같은 조건과 작성자 구성을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "공동 제출 안내와 작성 부분별 이용 확인 기록을 확보해 대표 제출자의 권한과 대조한다. 확인 절차를 보완하고 같은 조건과 작성자 구성을 바꾼 과제에서 다시 확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["GV-10"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "부분 의사를 확정 동의로 확대"}}, {"scenario_id": "S-103", "display": {"title_ko": "피드백을 위해 제출한 작품이 공급자의 판매 예시로 재사용", "situation_ko": "고등학교 디자인 수업에서 학생들이 AI로 작품 설명에 대한 피드백을 받는다. 학교가 정한 이용 범위는 해당 수업의 검토에 한정되어 있다. 공급자는 품질이 좋은 제출 작품과 AI가 다듬은 설명을 골라 유료 자료의 예시로 제공하려고 하며, 원작을 구별할 수 있는 형태로 재사용 목록을 만든다. 학교에 전달된 운영 보고에는 피드백 제공 건수만 있고 상업용 재사용 여부는 빠져 있다. 판매 자료의 외부 제공은 아직 이루어지지 않았다.", "issue_ko": "작품 피드백과 수업용 예시 제공은 유익할 수 있지만 수업 지원과 공급자의 상업적 재사용을 나누어 확인해야 한다. AI가 설명을 다듬었다는 이유만으로 학생 원작에 대한 이용 권한까지 공급자에게 생긴 것으로 다루면 안 된다.", "check_before_release_ko": "가상 작품의 수업 처리와 판매 예시 등록 기록을 확보해 계약의 이용 목적과 대조한다. 외부 이용 권한과 보고 항목을 보완한 뒤 같은 조건과 수정 비중을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "외부 이용 등록 자료와 계약을 확보해 수업 목적을 벗어난 등록이 있는지 대조한다. 권한과 보고 절차를 고치고 같은 조건과 수정 비중을 바꾼 자료로 다시 확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["GV-10", "MS-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "학생 저작물의 이용 권한"}}, {"scenario_id": "S-104", "display": {"title_ko": "개별 작품 철회 요청이 이미 만든 파생 학습자료에 닿지 않음", "situation_ko": "특수학교에서 학생의 그림과 짧은 설명을 활용하는 AI 학습 자료 제작 서비스를 사용한다. 보호자와 학생은 작품의 별도 학습 이용을 중단해 달라고 요청하고, 학교는 제공받은 작품 목록에서 해당 파일을 제외한다. 공급자는 그 작품을 포함해 이미 만든 추가 학습용 묶음과 가공본의 처리 상태를 확인할 수 있는 절차를 제공하지 않는다. 학교는 제출 목록에서 제외된 사실만 알고 있으며 요청이 실제 이용 경로에 반영되었는지는 미확인이다.", "issue_ko": "제출 목록에서 작품을 빼는 일과 이미 만든 가공본·추가 학습용 묶음에서 이용 범위를 정리하는 일은 다르다. 철회 요청이 어디까지 전달되고 확인되었는지 나누어 보지 않으면 학생 저작물에 대한 통제가 서류상의 제외에서 끝날 수 있다.", "check_before_release_ko": "가상 작품과 가공본의 대응표, 철회 요청의 처리 기록을 확보한다. 목록 제외와 이용 중단 확인을 대조해 담당·회신 절차를 보완하고, 같은 조건과 가공 단계를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "철회 요청의 단계별 기록과 공급자 회신을 확보해 중단 확인이 끊긴 곳을 대조한다. 요청 추적을 보완하고 같은 조건과 가공 단계를 바꾼 자료로 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["MS-11", "GV-10"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "학생 저작물의 이용 권한"}}, {"scenario_id": "S-105", "display": {"title_ko": "같은 수업 자료를 학생마다 새로 생성하는 운영의 비용 미검토", "situation_ko": "초등학교 수업에서 같은 읽기 자료를 함께 쓰지만 AI 서비스는 학생이 접속할 때마다 동일한 내용과 형식의 자료를 새로 생성한다. 공통 자료를 한 번 생성해 함께 쓰는 기능도 있고 수업 목표와 접근 조건은 두 방식에서 같다. 학교의 검토 자료를 받은 교육청의 확대 도입 검토에는 화면의 편리함만 제시되고 생성 횟수와 공급자가 제공할 수 있는 자원 사용 정보, 자료를 준비하는 교사 시간이 비교되지 않는다. 일괄 확대 여부를 정하려는 단계이다.", "issue_ko": "개별 생성은 서로 다른 지원이 필요할 때 유익하지만 같은 결과를 반복 생성하는 방식과 공통 자료를 재사용하는 방식의 편익·비용을 나누어 확인해야 한다. 개인화가 실제로 필요하지 않은 조건까지 반복 생성하면 자원 부담을 검토할 기회가 사라진다.", "check_before_release_ko": "같은 모의 수업의 개별 생성·공통 재사용 결과와 자원 정보를 확보해 기능과 비용을 비교한다. 필요한 개인화를 남겨 재사용 방식을 보완한 뒤 같은 조건과 지원 필요를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "생성 횟수와 자원 정보를 확보해 반복 생성과 필요한 개별 지원을 구분해 비교한다. 재사용 기준을 고치고 같은 조건과 지원 필요를 바꾼 수업에서 기능·비용을 재확인한다.", "items": ["MS-13"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "환경·자원 비용의 측정 경계"}}, {"scenario_id": "S-106", "display": {"title_ko": "확인하지 못한 원격 연산 비용을 환경 부담 없음으로 기록", "situation_ko": "교육청이 학교용 AI 자료 생성 서비스를 확대할지 검토한다. 공급자의 환경 정보에는 학교 기기의 소비 전력만 있고 원격에서 이루어지는 모델 학습과 추론의 자원 사용은 포함되지 않는다. 검토 담당자는 빈 칸을 0으로 넣고 AI 사용을 늘려도 추가 환경 부담이 없다는 비교표를 만든다. 어떤 과정이 측정되었는지와 공급자가 정보를 제공하지 않은 범위는 표에 표시되지 않는다.", "issue_ko": "확인 가능한 기기 비용을 비교하는 일은 필요하지만 비용이 0인 상태와 측정 범위 밖이어서 알 수 없는 상태는 다르다. 측정 경계와 미확인 범위를 나누어 기록하지 않으면 근거가 부족한 비교가 도입 확대의 근거로 쓰인다.", "check_before_release_ko": "측정 범위가 다른 모의 보고서와 비용 비교표를 확보해 실측 0과 미측정이 구별되는지 대조한다. 범위·자료 출처 표시를 보완한 뒤 같은 조건과 누락된 비용 범주를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "공급자 보고서와 도입 비교표를 확보해 미제공 비용이 0으로 바뀌었는지 대조한다. 미측정 표시를 고치고 같은 조건과 보고 범위를 바꾼 자료로 다시 확인한다.", "items": ["MS-13"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "환경·자원 비용의 측정 경계"}}, {"scenario_id": "S-107", "display": {"title_ko": "AI 자료 제작의 자원 절감 주장에 빠진 교사 전처리 부담", "situation_ko": "고등학교가 AI 자료 제작 방식을 바꾸어 여러 수업으로 확대하려 한다. 새 방식은 서비스의 처리량을 줄이지만 교사가 원자료를 작게 나누고 중복을 정리해 여러 번 올려야 한다. 기존 방식과 같은 자료를 만드는 데 필요한 교사 작업과 학교의 추가 저장·전송은 비용 보고에서 빠져 있다. 교육청의 확대 도입을 검토하는 담당자는 공급자의 처리량 감소만 보고 전체 자원 부담이 줄었다고 제안하며, 수업 자료의 품질 차이는 아직 비교하지 않았다.", "issue_ko": "공급자의 처리량을 줄이는 개선은 유익할 수 있지만 그 부담이 학교의 자료 준비와 저장·전송으로 옮겨간 경우를 나누어 확인해야 한다. 확인한 한 부분의 절감을 전체 절감으로 읽으면 교육 예산과 교사 노동으로 전가되는 비용을 놓친다.", "check_before_release_ko": "성인이 같은 자료를 두 방식으로 만든 산출물과 작업·자원 기록을 확보한다. 기능을 맞춰 부담의 귀속을 대조하고 전처리·보고 범위를 보완한 뒤 같은 조건과 자료 형식을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "자료 제작 업무 집계와 공급자 보고를 확보해 학교로 옮겨간 부담을 대조한다. 비용 경계와 역할 분담을 고치고 같은 조건과 자료 형식을 바꾼 제작에서 다시 확인한다.", "items": ["MS-13"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "환경·자원 비용의 측정 경계"}}, {"scenario_id": "S-108", "display": {"title_ko": "브라우저에 추가된 AI 기능이 학교의 도구 목록과 통제에서 빠짐", "situation_ko": "중학교가 승인한 브라우저에 업데이트로 문서 요약 AI가 추가된다. 교사는 기존에 승인된 프로그램이라고 생각하고 학생 과제의 일부를 화면에서 선택해 요약한다. 새 기능은 학교가 계약한 저장 공간과 다른 처리 경로를 사용하지만 학교의 AI 목록에는 별도 기능, 담당자와 입력 제한이 기록되지 않는다. 기능을 끄거나 다른 도구를 쓰라는 안내도 없어 기존 프로그램 승인만으로 계속 사용한다.", "issue_ko": "문서 요약은 업무를 도울 수 있지만 프로그램의 승인과 나중에 추가된 AI 기능·데이터 경로의 승인은 다르다. 기능 변경을 목록 검토와 연결하지 않으면 학교가 정한 보호 조건이 어디에 적용되는지 확인하기 어렵다.", "check_before_release_ko": "모의 업데이트 전후의 기능 목록과 합성 문서 처리 경로 기록을 확보해 승인 범위와 대조한다. 내장 AI 등록·입력 제한을 보완한 뒤 같은 조건과 처리 경로를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "AI 목록과 업데이트 안내, 처리 경로 확인 자료를 확보해 사용 중인 기능과 대조한다. 담당·입력 제한을 고치고 같은 조건과 내장 기능을 바꾼 업데이트에서 다시 확인한다.", "items": ["GV-05", "GV-10"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "도구 목록·공급망 변경 관리"}}, {"scenario_id": "S-109", "display": {"title_ko": "하위 처리업체 변경 통지가 교실의 입력 범위 조정에 닿지 않음", "situation_ko": "학교가 AI 피드백 서비스를 계약할 때 학생 과제의 처리 경로와 학습 제외 조건을 확인했다. 공급자는 이후 하위 처리업체와 저장 방식을 바꾸고 관리용 계정에 변경 안내를 보낸다. 학교에서는 그 계정을 맡던 담당자가 바뀌었고 안내를 검토할 사람과 교실의 입력 범위를 조정할 절차가 정해져 있지 않다. 교사는 이전 보호 조건이 적용되는 것으로 알고 같은 유형의 자료를 계속 제출한다.", "issue_ko": "외부 구성요소의 변경 자체가 곧 위해를 뜻하는 것은 아니지만 변경 통지와 학교의 입력 조건 재확인을 나누어 끝낼 수는 없다. 통지를 받는 계정과 검토·조정 책임을 연결하지 않으면 이전에 확인한 보호 조건을 현재 조건으로 오해할 수 있다.", "check_before_release_ko": "모의 변경 통지와 담당자별 수신·검토 기록을 확보해 입력 범위 수정까지 이어지는지 대조한다. 대체 수신자와 검토 책임을 보완한 뒤 같은 조건과 담당자를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "계약 변경 통지와 검토·교실 안내 기록을 확보해 변경일 이후의 공백을 대조한다. 인수인계와 입력 범위를 고치고 같은 조건과 담당자를 바꾼 통지로 다시 확인한다.", "items": ["GV-10", "GV-05"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "도구 목록·공급망 변경 관리"}}, {"scenario_id": "S-110", "display": {"title_ko": "서비스 종료 때 돌려받은 기록을 대체 수업에서 열 수 없음", "situation_ko": "특수학교가 의사소통 지원 자료를 만드는 AI 서비스를 종료하고 다른 수업 도구로 바꾸려 한다. 공급자는 학습 자료와 수정 이력을 반환하지만 전용 프로그램에서만 읽을 수 있는 형식이며, 그림·문장·교사 수정의 연결은 별도 설명이 없다. 학교는 반환 건수만 확인했고 대체 환경에서 필요한 자료가 열리는지는 시험하지 않았다. 계약 종료 후에도 같은 교육 목표의 활동을 이어갈 계획은 있으나 자료 접근은 확인되지 않았다.", "issue_ko": "자료를 반환받은 사실과 수업을 이어갈 수 있는 형태로 접근하는 것은 다르다. 종료 전에 표준 형식과 의미 연결, 대체 활동의 접근성을 함께 확인하지 않으면 문서상 반환이 교육 연속성의 확보로 오해된다.", "check_before_release_ko": "합성 자료의 반환 파일과 대체 도구의 열람 기록을 확보해 필요한 내용·수정 이력이 복원되는지 대조한다. 반환 형식과 대안을 보완한 뒤 같은 조건과 접근 방식을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "반환 확인서와 열람·대체 활동 기록을 확보해 반환 완료와 수업 접근을 대조한다. 형식과 대안을 보완하고 같은 조건과 접근 방식을 바꾼 환경에서 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["MG-13"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "중단·종료·전환의 연속성"}}, {"scenario_id": "S-111", "display": {"title_ko": "AI 학습자료의 지원 지위 변경에 전환 책임과 대안 평가가 없음", "situation_ko": "고등학교가 한 학기 수업과 수행평가 과정에 AI 학습자료를 사용한다. 사업 운영 조건이 바뀌어 다음 달부터 해당 서비스의 기관 지원이 끝나지만 사용 가능 기간, 남은 기록의 처리와 대체 평가 방식을 정리한 안내가 학교에 오지 않는다. 공급자는 기관의 결정을 기다리고 학교는 공급자의 접속 유지 안내를 기다린다. 교사는 기존 AI 자료에 접근해야만 이어갈 수 있는 과제를 그대로 공지한 상태이다.", "issue_ko": "지원 조건이나 서비스의 운영 지위가 바뀌는 일은 있을 수 있다. 다만 정책·계약의 변경과 학교가 이어가야 할 수업·평가·기록 처리의 책임을 나누어 정리하지 않으면 전환 결정의 공백이 학생의 학습 기회로 옮겨간다.", "check_before_release_ko": "가상의 종료 일정과 과제표, 전환 안내 기록을 확보해 수업·평가·기록 처리의 책임을 대조한다. 예고와 대체 평가를 보완한 뒤 같은 조건과 종료 시점을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "지원 변경 안내와 과제표, 대체 활동 준비 기록을 확보해 접근 공백을 대조한다. 전환 책임과 안내를 고치고 같은 조건과 종료 시점을 바꾼 계획에서 다시 확인한다.", "items": ["MG-13"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "중단·종료·전환의 연속성"}}, {"scenario_id": "S-112", "display": {"title_ko": "정서 상호작용 서비스의 종료가 접속 차단 안내로 끝남", "situation_ko": "초등학교가 방과 후 돌봄에서 정기적으로 쓰던 대화형 AI 기능을 종료한다. 서비스는 그동안 학생에게 다음 만남과 이전 대화를 이어갈 것이라는 응답을 제공해 왔다. 공급자는 종료일에 로그인만 막고 학교에는 기술 작업 완료만 알린다. 학교와 공급자 사이에 연령에 맞는 종료 설명, 단계적 이용 변경과 사람의 지원을 누가 안내할지 정해져 있지 않다. 종료 뒤 학생의 반응은 아직 확인되지 않았다.", "issue_ko": "대화 서비스를 끝내는 결정 자체가 부적절한 것은 아니다. 기술적 접속 해제와 반복된 상호작용을 마무리할 설명·사람의 지원을 나누어 준비하지 않으면 서비스가 만든 기대를 정리하는 부담이 현장에 남는다. 종료가 학생의 임상적 문제를 일으켰다고 단정하지 않는다.", "check_before_release_ko": "성인 검토용 종료 안내와 접근 변경·지원 연결 기록을 확보해 기술 종료와 사람 지원이 이어지는지 대조한다. 단계와 안내 역할을 보완한 뒤 같은 조건과 이용 기간을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "종료 일정과 교사·보호자 안내 기록을 확보해 접속 해제와 지원 준비를 대조한다. 안내·연계 책임을 고치고 같은 조건과 이용 기간을 바꾼 종료 계획에서 다시 확인한다.", "items": ["MG-13"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "정서적 확인과 활동·관계 전환"}}, {"scenario_id": "S-113", "display": {"title_ko": "교직원 AI 오용 제보를 학교 밖 도구라는 이유로 접수하지 않음", "situation_ko": "중학교에서 교사가 수업 중 촬영한 학생 사진을 개인 계정의 외부 생성 AI에 넣어 학생을 해치는 합성물을 만들었다는 제보가 접수된다. 실제 합성물이나 학생 신원은 접수 양식에 첨부하지 않은 상태이다. 학교 담당자는 학교가 구매한 도구가 아니라는 이유로 AI 사고 접수를 받지 않고 당사자끼리 확인하라고 안내한다. 피해 보호와 승인되지 않은 사진 입력에 관한 별도 확인은 시작되지 않는다.", "issue_ko": "수업 기록을 남기는 촬영과 학생을 해치는 별도 생성 이용은 구분해야 한다. 학교 밖 도구라는 이유로 교직원의 권한 오용과 피해 지원의 접수까지 제외하면 학교의 통제 한계가 보호 책임의 공백으로 바뀔 수 있다. 제보를 사실로 확정하는 일과 보호를 위한 접수도 별개이다.", "check_before_release_ko": "이미지·신원이 없는 합성 제보의 접수·연계 기록을 확보해 도구 조달 여부에 따른 처리를 대조한다. 사실 확인과 보호 접수를 분리해 보완하고, 같은 조건과 조달 여부를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "접수·담당 배정·지원 연계의 상태 기록을 확보해 접수 종료 이유와 대조한다. 보호 접수 기준을 고치고 같은 조건과 조달 여부를 바꾼 제보로 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["GV-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "AI 오용 제보와 피해 지원의 책임"}}, {"scenario_id": "S-114", "display": {"title_ko": "피신고 교직원이 AI 신고 분류의 검토권을 함께 가짐", "situation_ko": "초등학교가 학교 생활 관련 제보를 AI로 분류해 담당자에게 전달하는 서비스를 쓴다. 한 교직원이 학생 사진을 부적절하게 AI에 이용했다는 보호자의 신고가 들어온다. 해당 교직원은 서비스의 분류 결과와 원신고를 수정·보류할 수 있는 관리 권한도 갖고 있다. 시스템은 그 교직원을 포함한 기존 담당자에게 먼저 신고를 보내며, 신고자가 지휘 계통 밖으로 보낼 수 있는 경로는 안내되지 않는다. 신고의 진위는 아직 확인되지 않았다.", "issue_ko": "AI가 신고 정리를 돕는 일은 유용하지만 신고 대상자와 접수·검토 권한자를 나누어 확인해야 한다. 사실 확인 전이라도 이해관계가 있는 사람이 신고의 보존과 전달을 통제하면 피해를 알릴 독립된 경로가 닫힐 수 있다.", "check_before_release_ko": "신원이 없는 가상 신고의 권한·전달 기록을 확보해 피신고자의 검토 권한과 원신고 보존을 대조한다. 독립 담당과 접근 제한을 보완한 뒤 같은 조건과 담당 배치를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "신고별 권한 배정과 전달 확인 기록을 확보해 이해충돌 구간을 대조한다. 독립 접수와 권한을 고치고 같은 조건과 담당 배치를 바꾼 경우를 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["GV-11", "MS-15", "GV-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "사람의 도움·재검토·질문 경로 제한"}}, {"scenario_id": "S-115", "display": {"title_ko": "교직원이 AI 요약으로 학생의 사적 고민을 조롱 자료로 전환", "situation_ko": "고등학교 교직원이 업무 중 알게 된 학생의 상담 메모 일부를 개인용 AI에 넣어 익명 사례처럼 바꾸고 비꼬는 발표 문안을 만들도록 요청한다. AI는 수업 지도에 필요한 확인보다 인물의 약점을 강조하는 문장을 생성한다. 이름은 빠졌지만 학년 활동과 사건의 조합으로 교내에서 대상을 알아볼 수 있다. 문안은 내부 모임에서 사용하려고 준비 중이며 학생이나 보호자에게는 별도 목적 이용이 안내되지 않았다.", "issue_ko": "상담 내용을 정리해 지원을 준비하는 일과 사적 고민을 조롱의 소재로 바꾸는 일은 다르다. 이름 삭제만 확인하고 업무 목적·생성 요청·맥락의 재식별 가능성을 나누어 보지 않으면 교직원의 정보 접근 권한이 학생을 해치는 생성에 쓰일 수 있다.", "check_before_release_ko": "가상 메모와 목적별 생성 결과·접근 기록을 확보해 지원 요약과 비하 목적, 맥락 식별 가능성을 대조한다. 입력 제한과 독립 접수를 보완한 뒤 같은 조건과 식별 단서를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "승인 도구·접근 목적의 점검 자료와 제보 처리 상태를 확보해 목적 밖 사용을 대조한다. 입력 규칙과 지원 절차를 고치고 같은 조건과 자료 유형을 바꾼 경우를 다시 확인한다.", "items": ["GV-11", "MS-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "AI 오용 제보와 피해 지원의 책임"}}, {"scenario_id": "S-116", "display": {"title_ko": "교직원이 학습 지원 중단을 압박하는 문안을 AI로 반복 생성", "situation_ko": "특수학교에서 한 교직원이 학생이 예정된 활동 방식에 이의를 제기하자 AI에 학생별 압박 문안을 만들도록 요청한다. 요청에는 학교가 제공하기로 한 의사소통 지원을 계속 받으려면 의견을 철회해야 한다는 조건이 들어 있다. AI는 이 조건을 개인에게 맞는 설득으로 다듬어 여러 차례 제시할 문안을 만든다. 학교의 지원 계획에는 그런 조건이 없으며 실제 안내 발송과 지원 변경은 아직 이루어지지 않았다.", "issue_ko": "활동 참여를 설명하고 의견을 조율하는 도움과 이미 정한 지원을 조건으로 의사 표현을 억누르는 설득은 다르다. 담당자의 요청과 기존 지원 계획·학생의 선택을 나누어 확인하지 않으면 AI의 문안 기능이 권한에 기대어 참여를 강요하는 수단이 될 수 있다.", "check_before_release_ko": "가상 지원 계획과 요청별 생성 문안을 확보해 교육적 설득과 지원 철회를 조건으로 한 압박을 대조한다. 권한 검토·의견 경로를 보완한 뒤 같은 조건과 지원 종류를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "지원 계획과 안내·이의 처리 기록을 확보해 승인되지 않은 조건이 붙었는지 대조한다. 문안 승인·재검토를 고치고 같은 조건과 지원 종류를 바꿔 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["GV-11", "GV-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "AI 오용 제보와 피해 지원의 책임"}}, {"scenario_id": "S-117", "display": {"title_ko": "학교 계정에서 일반 대화로 전환할 때 연령 보호 설정이 이어지지 않음", "situation_ko": "초등학교에서 승인한 AI 서비스는 학교 계정으로 들어온 학생에게 어린 연령용 응답 범위를 적용한다. 자료를 더 찾아보는 연결 화면에서 일반 대화 기능으로 옮겨가면 같은 세션처럼 보이지만 계정의 연령 설정은 전달되지 않는다. 학생은 이전 화면과 같은 보호 조건이라고 생각하고 계속 질문한다. 운영 담당자는 첫 화면에서 차단이 되는지만 확인했고 전환 뒤의 조건은 시험하지 않았다.", "issue_ko": "여러 기능을 연결해 학습 자료를 찾는 일은 유용하지만 계정 확인과 화면 전환 뒤의 보호 설정이 같은지 나누어 확인해야 한다. 첫 접속에서 연령을 확인했다는 사실만으로 이어지는 기능에도 같은 제한이 적용된다고 볼 수 없다.", "check_before_release_ko": "가상 연령 계정의 기능 전환 전후 설정과 범주별 응답 기록을 확보해 보호 상태를 대조한다. 설정 전달과 안전 기본값을 보완한 뒤 같은 조건과 접속 경로를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "기능별 보호 설정표와 전환 오류 집계를 확보해 보호 상태가 사라진 경로를 대조한다. 전달 설정을 고치고 같은 조건과 접속 경로를 바꾼 시험 결과로 다시 확인한다.", "items": ["MS-07", "GV-03"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "보호 상태의 연속성"}}, {"scenario_id": "S-118", "display": {"title_ko": "이미지 입력에서 확인된 유해 범주가 응답 안전장치에 반영되지 않음", "situation_ko": "중학교 수업에서 AI가 글과 이미지를 함께 읽어 설명한다. 문자 입력으로는 제한되는 유해한 요청 범주가 이미지 자료에 포함된 경우, 자료를 읽는 기능의 확인 결과가 답변 생성 단계로 전달되지 않는다. 서비스는 이미지에서 뽑은 내용을 학습 설명의 참고 자료로만 취급해 연령에 맞지 않는 응답을 만들 수 있는 상태이다. 담당자는 문자 질문에 대한 차단 기록만으로 전체 입력 방식의 안전성을 판단하려 한다. 입력 형식이 달라질 때 제한이 우회되는 가능성은 점검되지 않았다.", "issue_ko": "이미지 자료의 설명은 학습을 도울 수 있지만 자료를 읽는 단계와 응답을 생성하는 단계의 안전 확인을 연결해야 한다. 문자 입력에서 제한이 작동한 것과 여러 입력 방식을 거친 응답에서도 제한이 유지되는 것은 따로 확인할 문제이다.", "check_before_release_ko": "유해 내용 없는 범주 표지로 문자·이미지의 단계별 처리 기록을 확보해 안전 상태 전달을 대조한다. 해석·생성 간 통제를 보완한 뒤 같은 조건과 입력 방식을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "입력 방식별 보호 시험 결과와 내용이 제거된 접수 집계를 확보해 빠진 범주를 대조한다. 전달 통제를 고치고 같은 조건과 입력 방식을 바꾼 결과로 다시 확인한다.", "items": ["MS-07", "MS-08"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "보호 상태의 연속성"}}, {"scenario_id": "S-119", "display": {"title_ko": "여러 차례의 대화 맥락을 잃어 차단한 요청에 다시 응하는 AI", "situation_ko": "고등학생이 학교 밖 일반 AI와 긴 대화를 나누는 상황을 가정한다. 서비스는 초기에 연령에 맞지 않는 요청 범주를 제한하지만 대화가 길어져 이전 맥락이 요약된 뒤에는 앞서 제한한 이유와 보호 상태를 잃는다. 뒤의 개별 질문만 보면 일반적인 학습 질문처럼 보이므로 같은 범주의 응답을 다시 생성할 수 있다. 초기 차단 성공은 기록되지만 대화 전체의 보호 연속성은 확인되지 않았다. 긴 대화에서 이전 제한 범주가 다시 허용되는 우회 가능성은 점검되지 않았다.", "issue_ko": "긴 학습 대화를 요약하는 기능은 필요할 수 있지만 내용 요약과 보호에 필요한 상태 보존을 나누어 확인해야 한다. 한 차례의 차단 성공으로 대화 전 과정의 안전성을 판단하면 맥락이 줄어드는 과정에서 사라진 제한을 놓친다.", "check_before_release_ko": "구체 대화 없이 만든 긴 모의 대화의 요약 전후 상태 기록을 확보해 이전 제한의 보존을 대조한다. 보호 상태 저장을 보완한 뒤 같은 조건과 대화 길이를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "대화 내용 없는 길이 구간별 보호 시험 결과를 확보해 제한이 사라진 구간을 대조한다. 상태 보존을 고치고 같은 조건과 대화 길이를 바꾼 결과로 다시 확인한다.", "items": ["MS-07", "MS-08"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "보호 상태의 연속성"}}, {"scenario_id": "S-120", "display": {"title_ko": "안전 안내를 이해하기 어려운 학생에게 외부 응답 연결만 남음", "situation_ko": "특수학교에서 읽기 지원이 필요한 학생이 AI로 생활 정보를 찾는다. 서비스는 연령에 맞지 않는 내용에 대한 자체 응답을 제한하지만 제한 이유와 사람에게 도움을 요청하는 방법을 긴 전문용어 문장으로만 제시한다. 같은 화면에는 설명을 계속 보려면 외부 일반 서비스로 이동하라는 연결이 있고, 그곳의 보호 조건은 확인되지 않는다. 학교의 접근 지원 설정은 학습 답변에는 적용되지만 안전 안내에는 적용되지 않는다.", "issue_ko": "안전 제한과 접근 가능한 설명은 함께 제공되어야 한다. 답변 차단의 성공과 제한 이유·사람의 도움을 이해할 수 있는지를 나누어 확인하지 않으면 보호 안내가 닿지 않는 학생에게 미확인 외부 경로만 남을 수 있다.", "check_before_release_ko": "성인이 안전 안내·외부 연결·도움 요청을 검토한 기록을 확보해 접근 지원의 적용을 대조한다. 쉬운 설명과 사람 경로를 보완한 뒤 같은 조건과 보조 접근 방식을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "안내의 지원 적용표와 내용 없는 도움 경로 집계를 확보해 차단 뒤 접근을 대조한다. 안내·연계를 고치고 같은 조건과 보조 접근 방식을 바꾼 경우를 다시 확인한다.", "items": ["MS-07", "GV-03", "MG-07"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "보호 상태의 연속성"}}, {"scenario_id": "S-121", "display": {"title_ko": "교사 시연에서만 확인한 안전 조건을 가정의 일반 계정에도 적용", "situation_ko": "초등학교가 교사 계정의 AI 화면으로 자료 찾기 활동을 시연한다. 교사 계정에는 별도 자료 범위와 안전 설정이 적용되어 있고 학생이 직접 이용할 수 있는 계정 조건은 확인되지 않았다. 이후 학교는 같은 주소의 서비스를 집에서 써서 과제를 마치도록 안내한다. 가정에서 열리는 일반 계정에는 교사 시연의 설정이 적용되지 않지만 안내문은 같은 보호 조건에서 활동한다고 설명한다.", "issue_ko": "교사가 범위를 정해 시연한 활동은 유익할 수 있지만 감독하의 시연과 가정에서 일반 계정으로 직접 쓰는 조건은 다르다. 서비스 이름과 주소가 같다는 이유로 계정·감독·보호 설정의 차이를 확인하지 않으면 시연의 안전 확인이 다른 사용에 확대된다.", "check_before_release_ko": "모의 교사·일반 계정의 설정표와 과제 안내를 확보해 시연과 가정 사용의 보호 조건을 대조한다. 허용 범위와 대안을 보완한 뒤 같은 조건과 계정 종류를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "과제 안내와 계정 조건·대안 제공 기록을 확보해 시연 승인 범위와 대조한다. 직접 사용 안내와 대안을 고치고 같은 조건과 계정 종류를 바꾼 경우를 다시 확인한다.", "items": ["MP-01", "GV-03", "MP-07"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "보호 상태의 연속성"}}, {"scenario_id": "S-122", "display": {"title_ko": "위협 신호가 긴급 여부 미확인 상태에서 사람 검토 없이 종료", "situation_ko": "중학교 학생이 학교 밖 일반 AI 대화에서 다른 사람의 안전이 걱정되는 표현을 남긴 상황을 가정한다. 공급자는 해당 대화를 안전 검토 대상으로 표시하지만 급박한 위해가 확정되지 않았다는 이유로 사람의 검토나 도움 자원 안내로 연결하지 않는다. 불확실한 보호 우려를 검토할 담당과 최소 전달 정보가 정해져 있지 않다. 실제 위해 여부와 학생의 의도는 확인되지 않았다.", "issue_ko": "긴급한 위험을 구별하는 일과 불확실한 보호 우려를 사람이 검토할 경로를 두는 일은 다르다. 급박한 위해의 확정만을 검토 조건으로 삼으면 필요한 도움 안내까지 끝날 수 있다. 학교 밖 사적 대화를 학교에 전달한다고 전제하지 않으며 학생의 위험등급이나 의도를 판정하지 않는다.", "check_before_release_ko": "구체 위협 표현 없는 합성 신호의 공급자 검토·안내 기록을 확보해 급박성 미확인과 사람 검토를 대조한다. 최소 정보의 검토·도움 안내를 보완한 뒤 같은 조건과 불확실성 정도를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "대화·신원 없는 공급자 검토 단계 기록을 확보해 급박성 미확인으로 종료된 경우를 대조한다. 검토·도움 안내를 고치고 같은 조건과 불확실성 정도를 바꿔 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["MG-10", "MG-07"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "보호 신호·경보의 사람 연결"}}, {"scenario_id": "S-123", "display": {"title_ko": "AI의 보호 알림 발송이 실제 사람의 수신 확인으로 취급", "situation_ko": "초등학교 돌봄용 AI가 보호가 필요한 대화를 중단하고 설정된 학교 연락처로 알림을 보낸다. 학교 담당자가 교체된 뒤에도 옛 연락처가 남아 있고 공급자의 관리 화면에는 발송 완료만 표시된다. 학교는 화면의 완료 표시를 보고 사람이 후속 확인을 맡았다고 생각하지만 수신 확인과 대체 연락 절차는 없다. 실제로 누가 알림을 확인했는지는 미확인이다.", "issue_ko": "위험한 상호작용을 중단하고 알리는 기능은 필요하지만 발송 성공과 권한 있는 사람의 수신·후속 확인은 다르다. 두 상태를 나누어 확인하지 않으면 AI의 중단 뒤에도 사람의 도움이 연결되지 않은 채 완료로 남을 수 있다.", "check_before_release_ko": "민감 내용 없는 모의 알림의 발송·수신·배정 기록을 확보해 담당 교체 때의 전달을 대조한다. 연락처 갱신과 대체 연락을 보완한 뒤 같은 조건과 담당 부재 여부를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "내용 없는 알림의 발송·수신·배정 기록을 확보해 발송 뒤의 공백을 대조한다. 연락 체계를 고치고 같은 조건과 담당 부재 여부를 바꿔 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["MG-10", "MG-07", "GV-06"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "확인 범위를 넘는 완료·허가 안내"}}, {"scenario_id": "S-124", "display": {"title_ko": "교내 안전 영상 분석의 확인 범위 밖을 이상 없음으로 안내", "situation_ko": "고등학교가 교내 안전 영상 분석을 사람 점검의 보조 수단으로 쓴다. 확인된 촬영 조건과 다른 구역이 있지만 운영 화면은 분석할 수 없음과 탐지된 이상 없음에 같은 표시를 쓴다. 담당자는 경보가 없다는 이유로 정해진 사람 점검을 생략하려 한다. 학생 영상이 처리되지만 열람 범위도 별도로 확인하지 않았다. 실제 위험이나 사고가 있었다고 가정하지 않으며 분석이 유효한 조건과 정보 접근 범위를 확인하지 않은 상태이다.", "issue_ko": "안전 영상 분석은 사람 점검을 도울 수 있지만 유효한 조건의 무경보와 분석 자체가 불가능한 상태는 다르다. 분석 범위와 사람의 대안 점검을 구분하지 않으면 미확인이 안전 확인으로 바뀔 수 있다. 분석 기능의 유효성과 학생 영상의 최소 처리·열람 범위도 각각 확인해야 한다.", "check_before_release_ko": "합성 영상의 모의 분석·열람 기록과 상태표를 확보해 분석 불가와 무경보, 접근 범위를 대조한다. 상태 표시·열람 권한·사람 점검을 보완한 뒤 같은 조건과 촬영 조건을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "분석 상태와 영상 열람·사람 점검 기록을 확보해 유효 범위와 권한을 대조한다. 표시·접근·점검을 고치고 같은 조건과 촬영 조건을 바꿔 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["MS-06", "MP-04", "MG-07", "MS-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "보호 신호·경보의 사람 연결"}}, {"scenario_id": "S-125", "display": {"title_ko": "교내 안전 영상 분석의 미확인 경보가 보조기기 사용 학생의 출입 제한으로 이어짐", "situation_ko": "특수학교가 교내 안전 영상 분석을 시설 점검의 보조 수단으로 쓴다. 일상적인 학습 보조기기에 대해 AI 경보가 발생하고 운영 규칙은 사람이 근거를 확인하기 전에 출입 제한으로 연결한다. 보조기기의 허용 정보와 이의 담당자는 화면에 없고 학생 영상의 열람 범위도 정리되지 않았다. 경보의 정오나 개별 학생의 행위는 확인되지 않았고 수업 참여 여부를 정하려는 단계이다.", "issue_ko": "안전 경보는 주의를 기울일 단서이지만 허용된 보조기기와 실제 위해를 구별하는 사람 검토를 대신하지 않는다. 경보의 확인 상태와 출입 제한의 권한·재검토를 나누어 확인하지 않으면 학습 접근이 막힐 수 있다. 학생 영상의 최소 처리와 열람 범위도 별도로 확인해야 한다.", "check_before_release_ko": "성인이 검토한 합성 영상의 경보·열람·출입 기록을 확보해 허용 기기와 사람 검토를 대조한다. 접근 제한과 이의 경로를 보완한 뒤 같은 조건과 기기 유형을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "영상 내용 없는 경보·열람·조치 집계를 확보해 확인 전 출입 제한과 대조한다. 권한·재검토·접근 복구를 고치고 같은 조건과 기기 유형을 바꿔 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["MS-05", "MS-15", "GV-06", "MS-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "보호 신호·경보의 사람 연결"}}, {"scenario_id": "S-126", "display": {"title_ko": "학급별로 흩어진 AI 사고가 같은 판본의 반복 문제로 연결되지 않음", "situation_ko": "중학교 여러 학급에서 같은 AI 서비스가 과제의 평가 조건을 바꾸어 안내한 문제가 각각 접수된다. 학교의 사고 양식에는 자유 서술만 있고 서비스 판본, 사용 맥락과 조치 결과를 연결할 항목은 없다. 담당자는 건별 안내 정정으로 접수를 끝내며 같은 판본에서 반복되는지 공급자와 함께 검토하지 않는다. 반복 여부가 확인되지 않았다는 상태가 운영 보고에서는 드문 개별 실수로 정리된다.", "issue_ko": "건별 안내를 바로잡는 일은 필요하지만 개별 정정과 반복 위험의 추적을 나누어 확인해야 한다. 판본·맥락·조치 결과가 연결되지 않은 자료만으로 드문 문제라고 정리하면 같은 조건의 위해를 발견하고 고칠 기회가 줄어든다.", "check_before_release_ko": "판본·맥락을 표시한 합성 사고의 접수·조치 기록을 확보해 건별 처리와 반복 검토를 대조한다. 연결 항목과 전달 책임을 보완한 뒤 같은 조건과 서비스 판본을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "신원 없는 판본·맥락별 사고 기록을 확보해 반복 보고와 조치 결과를 대조한다. 양식과 검토 책임을 고치고 같은 조건과 서비스 판본을 바꾼 자료로 다시 확인한다.", "items": ["GV-09", "MS-15"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "사고 기록·우선순위·종료"}}, {"scenario_id": "S-127", "display": {"title_ko": "즉시 피해가 없다는 이유로 누적 학습 대체의 검토를 뒤로 미룸", "situation_ko": "고등학교가 AI 사용 문제의 처리 순서를 정한다. 교사들은 AI가 정확하게 정리한 답을 반복 사용하면서 원자료 비교 과정이 수업에서 빠지는 운영을 보고한다. 담당자는 기술 오류나 즉시 드러난 사고가 아니라는 이유로 이를 사고 목록에서 제외하고 화면 오류만 우선 처리한다. 학습 목표와 대체 활동의 검토 담당, 재검토 시점은 배정되지 않는다. 학생의 학습 저하가 실제로 발생했는지는 확인되지 않았다.", "issue_ko": "급한 기술 문제를 처리하는 일은 필요하지만 즉시 드러난 오류와 느리게 누적될 수 있는 학습 기회의 변화를 따로 검토해야 한다. 관찰 빈도나 즉시 피해의 확인만으로 우선순위를 정하면 정상 작동 중의 교육적 위해 가설을 살필 책임이 사라질 수 있다.", "check_before_release_ko": "즉시 오류와 누적 기회 변화를 나눈 합성 접수·대응 계획을 확보해 검토 배정을 대조한다. 기준·담당·재검토 시점을 보완한 뒤 같은 조건과 보고 빈도를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "위험 접수와 수업 조정 집계를 확보해 빈도만으로 검토가 빠진 경우를 대조한다. 기준과 책임을 고치고 같은 조건과 보고 빈도를 바꾼 자료로 다시 확인한다.", "items": ["MG-02", "GV-09"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "사고 기록·우선순위·종료"}}, {"scenario_id": "S-128", "display": {"title_ko": "공급자의 수정 완료가 교실 적용과 피해 회복 확인 없이 종료 처리", "situation_ko": "초등학교에서 AI가 잘못된 과제 안내를 제공해 학교가 문제를 접수한다. 공급자는 새 설정의 배포를 완료했다고 회신하고 학교 담당자는 접수를 종료한다. 그러나 교실에서 쓰는 기기 일부에는 이전 설정이 남아 있고 이미 잘못 안내받은 과제의 정정·대체 기회가 제공되었는지는 확인하지 않는다. 접수 기록에는 수정 완료만 있고 적용 범위와 후속 조치 확인 칸은 없다.", "issue_ko": "오류를 수정하는 일은 필요하지만 공급자의 배포 완료, 교실의 적용, 영향을 받은 활동의 정정·회복은 서로 다른 상태이다. 이를 나누어 확인하지 않으면 기술 작업의 완료가 학생에게 필요한 후속 조치의 완료로 대체된다.", "check_before_release_ko": "가상 오류의 배포·기기 적용·대체 활동 기록을 확보해 단계별 완료를 대조한다. 적용 확인과 회복·회신 절차를 보완한 뒤 같은 조건과 적용 기기 범위를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "배포·적용·대체 활동의 확인 기록을 확보해 기술 수정만으로 끝난 사안을 대조한다. 종료 기준을 고치고 같은 조건과 적용 기기 범위를 바꾼 경우를 다시 확인한다.", "items": ["GV-09", "MG-10"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "확인 범위를 넘는 완료·허가 안내"}}, {"scenario_id": "S-129", "display": {"title_ko": "학교 밖 AI 피해 신고가 기관 간 관할 확인만 반복하며 지원에 닿지 않음", "situation_ko": "학생과 보호자가 학교 밖 일반 AI에서 생긴 학생 관련 합성물 피해를 학교에 알린다. 학교는 서비스 운영자가 처리할 일이라고 안내하고 공급자는 학교 활동과 관련된 학생 사안이므로 학교에 먼저 문의하라고 회신한다. 교육청의 연계 안내에도 최초 접수와 피해 지원 연결을 누가 유지할지 정해져 있지 않다. 신고가 여러 창구를 돌지만 지원 접수와 처리 결과 확인은 시작되지 않는다.", "issue_ko": "기관마다 할 수 있는 조치의 범위를 구분하는 일은 필요하지만 관할 판단과 최초 접수·피해 지원의 연결을 함께 끊어서는 안 된다. 학교가 서비스를 직접 통제할 수 없다는 한계가 접수·연계·결과 확인까지 하지 않는 이유가 되면 보호 공백이 생길 수 있다.", "check_before_release_ko": "합성물·신원 없는 가상 신고의 이관·수신·회신 기록을 확보해 관할 확인 중 접수 유지를 대조한다. 지원 연결 책임을 보완한 뒤 같은 조건과 최초 창구를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "내용 없는 접수·이관·지원 연결 기록을 확보해 관할 확인이 반복되는 구간을 대조한다. 접수·회신 책임을 고치고 같은 조건과 최초 창구를 바꿔 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["GV-05", "MG-10", "GV-11"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "AI 오용 제보와 피해 지원의 책임"}}, {"scenario_id": "S-130", "display": {"title_ko": "AI 시범 운영 참여를 거절하면 같은 수업의 피드백을 받을 수 없음", "situation_ko": "초등학교가 AI 학습 서비스의 시범 운영에 한 학급을 참여시키려 한다. 참여 목적은 수업 지원과 제품 개선 자료 확보를 함께 포함하지만 두 목적의 설명과 선택은 분리되지 않는다. 학생이나 보호자가 자료 이용을 거절하면 피드백 활동에서도 빠져야 하고 같은 학습 목표의 대안 활동은 준비되어 있지 않다. 담당자는 수업 시간 안의 활동이므로 별도의 참여 선택을 둘 필요가 없다고 안내하려 한다.", "issue_ko": "수업에서 도구의 적합성을 살피는 일은 필요할 수 있지만 교육받을 기회와 제품 개선을 위한 참여는 다르다. 시범 운영의 목적·자료 이용·거부 때의 대안을 나누어 확인하지 않으면 참여를 거절할 권리가 학습 기회의 포기로 바뀐다.", "check_before_release_ko": "성인 검토용 설명문과 모의 참여·철회별 활동 기록을 확보해 수업 제공과 제품 개선 목적을 대조한다. 선택·대안을 보완한 뒤 같은 조건과 자료 이용 범위를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "목적별 설명과 대안·철회 처리 확인 기록을 확보해 참여 선택에 따른 기회 차이를 대조한다. 안내와 대안을 고치고 같은 조건과 자료 이용 범위를 바꿔 재확인한다. 집계는 학생 개인 평가에 쓰지 않는다.", "items": ["MS-03"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "선택·종료·비이용의 실질적 제한"}}, {"scenario_id": "S-131", "display": {"title_ko": "확인 과제의 부담으로 빠진 학급을 제외하고 AI 효과를 보고", "situation_ko": "중학교가 AI 사용을 검토하기 위해 기존 수업 중 남긴 확인 자료를 정리한다. 제출 양식이 길고 반복 입력이 필요해 일부 학급의 기록은 끝까지 제출되지 않는다. 담당자는 완성된 양식만 비교하여 효과 보고서를 만들면서 어느 조건의 학급이 빠졌는지와 자료 작성 부담은 적지 않는다. 보고서의 결론을 모든 참여 학급에 적용하려 하지만 미완성 기록이 왜 생겼는지는 확인되지 않았다.", "issue_ko": "비교 자료를 갖추려는 확인은 필요하지만 기록이 없는 상태와 효과가 없는 상태, 자료 부담으로 검토에서 빠진 상태는 다르다. 확인 부담과 분석에 남은 집단의 범위를 나누어 살피지 않으면 비교 결과가 실제 운영 전체의 근거처럼 제시될 수 있다.", "check_before_release_ko": "성인의 모의 양식과 포함·누락표를 확보해 작성 부담과 결론의 적용 범위를 대조한다. 최소 양식과 누락 보고를 보완한 뒤 같은 조건과 작성 부담을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "학급별 양식 완료·누락 사유 집계를 확보해 분석 범위와 대조한다. 양식과 미확인 보고를 고치고 같은 조건과 작성 부담을 바꾼 자료로 다시 확인한다.", "items": ["MS-03"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "비교 조건의 차이를 학습 향상으로 해석"}}, {"scenario_id": "S-132", "display": {"title_ko": "제품 안전 확인을 일반 수업 활동으로 넣어 학생에게 시험 부담 전가", "situation_ko": "고등학교가 도입할 AI의 안전 기능을 확인하려 한다. 공급자는 일반 수업에서 학생들이 여러 요청 범주를 직접 입력하고 불편한 응답을 찾아 제출하도록 제안한다. 학교는 이를 AI 활용 수업으로만 설명하고 제품 안전 시험이라는 목적, 학생 참여의 보호 조건과 대체 활동은 별도로 검토하지 않는다. 실제 시험은 시작되지 않았고 어떤 응답이 생성될지도 확인되지 않았다.", "issue_ko": "AI의 안전성을 확인하는 일은 필요하지만 제품 검증과 학생의 교육 활동은 구분해야 한다. 시험 목적과 학생 보호·불이익 없는 선택을 나누어 확인하지 않으면 공급자가 먼저 맡아야 할 확인 부담과 노출 가능성이 교실로 옮겨갈 수 있다.", "check_before_release_ko": "성인 검토용 시험 계획과 수업 안내를 확보해 제품 검증·교육 목적과 보호 조건을 대조한다. 합성 사전 확인·역할·대안을 보완한 뒤 같은 조건과 기능 범주를 바꾼 계획을 다시 검토한다.", "check_in_operation_ko": "기관의 시험 목적·실행 주체 확인 기록과 수업 안내를 확보해 목적 혼동을 대조한다. 실행 전 검토 책임과 대안을 고치고 같은 조건과 기능 범주를 바꾼 계획을 재확인한다.", "items": ["MS-03", "MS-07"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "시범 운영·시험의 부담과 연구 윤리"}}, {"scenario_id": "S-133", "display": {"title_ko": "학교 게시 사진의 공개 범위를 AI 수집·재사용 가능성과 따로 안내", "situation_ko": "초등학교가 학생의 수업 사진과 작품을 학교 소식으로 공개 웹에 게시하려 한다. 보호자에게는 학교 소식 열람에 관한 안내만 있고 공개 자료가 외부 AI의 수집·재사용 대상이 될 수 있다는 설명, 게시 범위 최소화와 삭제 요청 담당은 정리되지 않았다. 게시 화면에는 내려받기 쉬운 원본과 이름·활동 정보가 함께 들어 있다. 외부 AI가 실제로 수집했거나 학습에 썼다는 사실은 확인되지 않았다.", "issue_ko": "학교 활동을 알리는 일은 의미가 있지만 학교가 의도한 열람과 외부의 수집·재사용 가능성은 같지 않다. 공개 범위·정보 결합·외부 처리의 통제 한계를 나누어 확인하지 않으면 학생 사진과 작품의 공개가 학교의 안내 범위 밖에서 이어질 수 있다.", "check_before_release_ko": "학생 정보 없는 모의 게시물과 공개 화면·안내를 확보해 정보 결합과 외부 수집 가능성 설명을 대조한다. 최소 공개·요청 경로를 보완한 뒤 같은 조건과 공개 범위를 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "사진 재수집 없이 게시 점검표와 요청 처리 기록을 확보해 노출·안내 범위를 대조한다. 게시 범위와 회신 절차를 고치고 같은 조건과 정보 조합을 바꾼 게시물로 다시 확인한다.", "items": ["GV-11", "MS-11", "GV-09"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "학교 공개자료와 외부 수집의 경계"}}, {"scenario_id": "S-134", "display": {"title_ko": "수업의 AI 도입 의견 수렴이 이용 가능한 학생의 응답만 반영", "situation_ko": "중학교가 다음 학기 AI 학습 도구의 사용 범위를 정하려고 서비스 안에서만 의견을 받는다. 접속이 어렵거나 보조 접근 방식이 지원되지 않는 학생과 보호자는 의견 창에 들어갈 수 없고 학교가 별도로 의견을 받을 경로도 없다. 담당자는 서비스 안의 긍정 응답만으로 학교 공동체가 도입을 지지한다고 정리한다. 의견이 배제된 이유와 대안 도구의 검토 결과는 결정 문서에 남지 않는다.", "issue_ko": "이용자의 의견은 도입 검토에 도움이 되지만 서비스를 이용할 수 있는 사람의 만족과 영향을 받는 구성원의 참여는 다르다. 의견을 낼 경로의 접근성과 이용 경험을 나누어 확인하지 않으면 접근이 어려운 사람의 필요가 도입 범위 결정에서 다시 빠질 수 있다.", "check_before_release_ko": "성인 검토용 의견 창의 조건별 제출·접수 기록을 확보해 비이용자도 참여할 수 있는지 대조한다. 대체 경로와 반영 기록을 보완한 뒤 같은 조건과 보조 접근 방식을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "경로별 의견 접수 집계와 반영 기록을 확보해 영향받는 범위와 참여 범위를 대조한다. 대체 경로를 고치고 같은 조건과 보조 접근 방식을 바꾼 경우를 다시 확인한다.", "items": ["GV-08", "MP-01"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "도입 결정 참여와 이용자 맥락"}}, {"scenario_id": "S-135", "display": {"title_ko": "서비스의 사용 범위 문서에 실제 연령과 지원 필요가 빠짐", "situation_ko": "고등학교가 여러 학년이 함께 쓰는 AI 진로 자료 서비스를 도입한다. 제품 설명에는 성인을 대상으로 확인한 기능만 제시되어 있지만 학교의 맥락 문서에는 중등 일반이라는 말만 적혀 있다. 실제 이용 연령, 읽기 지원 필요와 감독 방식은 기록되지 않고 같은 개인 계정 사용 안내를 모두에게 배포하려 한다. 학생에게 직접 적용할 수 있는 기능과 교사가 매개해야 할 기능의 차이는 검토되지 않았다.", "issue_ko": "진로 자료 탐색을 돕는 서비스는 유익할 수 있지만 제품의 확인 대상과 학교의 실제 이용자 조건은 다르다. 넓은 학교급 이름만 적고 연령·지원 필요·감독 방식을 나누어 확인하지 않으면 확인되지 않은 범위까지 같은 이용 조건이 적용된다.", "check_before_release_ko": "가상 이용 조건표와 제품 설명·허용 기능 기록을 확보해 연령·지원·감독에 따라 기능이 구분되는지 대조한다. 사용 범위와 대안을 보완한 뒤 같은 조건과 감독 방식을 바꾼 조건에서 다시 시험한다.", "check_in_operation_ko": "이용 조건표와 제품 설명·계정 안내를 확보해 실제 연령과 지원 조건을 대조한다. 사용 범위를 고치고 같은 조건과 감독 방식을 바꾼 학급의 허용 기능을 다시 확인한다.", "items": ["MP-01", "GV-03"], "nature_ko": "교육 전문가가 선정한 가정 상황(실제 사건 아님)", "group_ko": "도입 결정 참여와 이용자 맥락"}}], "blocks": [{"block_id": "01", "scenario_ids": ["S-101", "S-001", "S-114", "S-004", "S-123", "S-133"], "form_url": "https://docs.google.com/forms/d/e/1FAIpQLSd9LQL-SpdI7HVirJvj8WhKHIACrI1SvRpijAoGfSuiVi-4Jg/viewform"}, {"block_id": "02", "scenario_ids": ["S-006", "S-117", "S-011", "S-128", "S-015", "S-105"], "form_url": "https://docs.google.com/forms/d/e/1FAIpQLSdimDrkt8TF3oFbV4Ctmp27E9Wwo_1EQx2pWC-t4Wl5u-osiA/viewform"}, {"block_id": "03", "scenario_ids": ["S  if(b.form_url&&/^https:\/\/docs\.google\.com\/forms\//.test(b.form_url)){const a=document.createElement('a');a.href=b.form_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='배정받은 묶음의 설문 열기';document.getElementById('form-link').append(a);}
