<style>

:root{
  color-scheme:light;
  --bg:#f7f7f4; --paper:#ffffff; --panel:#f0efea; --ink:#1c1f24; --ink2:#4a4f57; --muted:#6c7079;
  --line:#dddcd5; --line2:#e9e8e2; --accent:#1d5a86; --accent-soft:#e6eef5; --hl:#fff4dc; --hl-ink:#6b4a00;
  --done:#0f7a3a; --part:#9a6200; --none:#7a7f88;
  --p2:#2a78d6; --p1:#eb6834; --p3:#1baf7a; --p4:#eda100; --p5:#e87ba4; --shadow:0 1px 2px rgba(0,0,0,.05);
  --eh-bg:var(--paper); --eh-line:var(--line); --eh-ink:var(--ink); --eh-ink2:var(--ink2); --eh-muted:var(--muted); --eh-soft:var(--accent-soft); --eh-accent:var(--accent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#161716; --paper:#1d1e1d; --panel:#222321; --ink:#ecebe6; --ink2:#c3c1b8; --muted:#9a988f;
  --line:#363633; --line2:#2b2c2a; --accent:#7fb6dd; --accent-soft:#1f2c36; --hl:#3a2f12; --hl-ink:#f3d58a;
  --done:#5cc486; --part:#e2a84a; --none:#8d9098;
  --p2:#3987e5; --p1:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161716; --paper:#1d1e1d; --panel:#222321; --ink:#ecebe6; --ink2:#c3c1b8; --muted:#9a988f;
  --line:#363633; --line2:#2b2c2a; --accent:#7fb6dd; --accent-soft:#1f2c36; --hl:#3a2f12; --hl-ink:#f3d58a;
  --done:#5cc486; --part:#e2a84a; --none:#8d9098;
  --p2:#3987e5; --p1:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent);text-underline-offset:3px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:600}


.eair-h{position:sticky;top:0;z-index:60;background:var(--eh-bg,#fff);border-bottom:1px solid var(--eh-line,#dddcd5);
  font:14px/1.4 "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
.eair-h *{box-sizing:border-box}
.eair-in{max-width:1240px;margin:0 auto;padding:7px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.eair-brand{font-weight:700;color:var(--eh-ink,#1c1f24);text-decoration:none;white-space:nowrap}
.eair-brand:hover{color:var(--eh-accent,#1d5a86)}
.eair-proj{color:var(--eh-muted,#6c7079);font-size:12.5px;white-space:nowrap;padding-left:14px;border-left:1px solid var(--eh-line,#dddcd5)}
.eair-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.eair-tabs::-webkit-scrollbar{display:none}
.eair-tabs a{padding:6px 10px;border-radius:7px;color:var(--eh-ink2,#4a4f57);text-decoration:none;white-space:nowrap}
.eair-tabs a:hover{background:var(--eh-soft,#e6eef5);color:var(--eh-ink,#1c1f24)}
.eair-tabs a[aria-current=page]{background:var(--eh-soft,#e6eef5);color:var(--eh-accent,#1d5a86);font-weight:700}
.eair-tools{display:flex;gap:8px;align-items:center;margin-left:auto}
@media (max-width:760px){.eair-proj{display:none}.eair-tabs{order:5;flex-basis:100%}}
@media print{.eair-h{display:none}}

main{max-width:860px;margin:0 auto;padding:30px 20px 100px}
h1{font-size:1.75em;line-height:1.35;margin:.2em 0 .5em}
h2{font-size:1.25em;margin:1.8em 0 .5em}
h3{font-size:1.08em;margin:.2em 0 .3em}
p,li{margin:.45em 0}
ul{padding-left:1.3em}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.lede{font-size:1.04em;color:var(--ink2)}
.muted{color:var(--muted)} .small{font-size:13.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:16px 0}
.draftnote{display:inline-block;font-size:12.5px;background:var(--hl);color:var(--hl-ink);border-radius:6px;padding:3px 9px;margin:0 0 8px}
.notice{margin:16px 0}.notice summary{cursor:pointer;font-weight:600}
.qform fieldset{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:16px 20px 6px;margin:18px 0}
.qform legend{font-weight:700;padding:0 6px}
.qi{margin:6px 0 18px}
.ql{font-weight:600;margin:.2em 0 .45em;display:block;line-height:1.55}
.hint{font-size:13px;color:var(--muted);margin:-.2em 0 .45em}
.req{font-size:11.5px;color:var(--hl-ink);background:var(--hl);padding:1px 6px;border-radius:999px;font-weight:600;margin-left:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px 8px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;background:var(--bg);line-height:1.4}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opts label:has(input:disabled){opacity:.5;cursor:not-allowed}
.qform textarea,.qform input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;line-height:1.65}
.qcard{border-top:1px solid var(--line2);padding-top:14px;margin-top:14px}
.qcard:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sticky-bar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:14px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.sticky-bar .grow{flex:1}
.okbox,.warnbox{border-radius:10px;padding:12px 14px;margin:12px 0}
.okbox{background:var(--accent-soft)} .warnbox{background:var(--hl);color:var(--hl-ink)}
.okbox p,.warnbox p{margin:.3em 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
footer.pg{margin-top:56px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style>

<script>
const D = {"riskdefs": {"ED1": {"side": "교육", "name": "학습·인지 과정의 대체", "defn": "AI가 학습자가 스스로 수행해야 할 사고, 인출, 생산적 고투를 대신하여 AI 없이 수행하는 능력과 유지되는 학습이 줄어드는 위험이다.", "ex": "정답과 풀이를 바로 제공하는 튜터; 과제 수행량은 늘었으나 AI 없는 시험 수행 하락; 탐색 경로의 조기 폐쇄"}, "ED2": {"side": "교육", "name": "메타인지와 판단 조건의 왜곡", "defn": "AI의 동조, 과신, 편향된 확증이 학습자의 자기 이해와 판단 근거를 왜곡하여 실제보다 높은 역량을 믿게 하거나 반대 증거를 다루지 못하게 하는 위험이다.", "ex": "틀린 풀이에 동조하는 아첨; 역량 착각; 확증 편향 강화와 에코챔버"}, "ED3": {"side": "교육", "name": "정서 발달과 의존", "defn": "학습자와 AI의 정서적 상호작용에서 생긴 위해이다. 정서적 의존·애착, AI 응답이 낳은 수치심·불안, 위기 신호에 대한 부적절한 응답이나 사람의 도움으로의 연결 실패가 여기에 든다. 다른 위해(딥페이크 피해, 오판 징계 등)에 따르는 정서적 고통은 그 위해의 결과로 다루고 이 범주에 넣지 않는다.", "ex": "동반자형 챗봇 정서 의존; 자해 신호에 대한 부적절 응답; 교정 과정의 수치심 유발"}, "ED4": {"side": "교육", "name": "사회성과 관계 발달", "defn": "의인화된 AI와의 준사회적 관계가 또래와 교사와의 상호작용, 협력 학습을 대체하거나, AI가 타인을 사칭하거나 관계를 조작하는 데 쓰이는 위험이다.", "ex": "대인소통 회피; 급우·교사를 사칭한 챗봇; 딥페이크를 이용한 괴롭힘"}, "ED5": {"side": "교육", "name": "주체성·가치·학업윤리", "defn": "AI가 학습 주도성과 자기결정, 가치 형성에 개입하거나 설득과 보상으로 행동을 유도하고, 학업 정직성의 조건을 흔드는 위험이다.", "ex": "결단 회피와 판단 위임; 보상과 설득을 통한 행동 유도; 규범에 대한 과잉 순응"}, "ED6": {"side": "교육", "name": "신체·생활 리듬", "defn": "화면 노출, 수면, 주의와 시간의 잠식, 신체활동 감소, 그리고 디지털 설명을 현실에서 잘못 실행하여 신체 위해가 생기는 위험이다.", "ex": "야간 장시간 사용; 주의와 시간의 잠식; 실험·운동 안전 설명의 오용"}, "ED7": {"side": "교육", "name": "평가 타당성과 교육적 결정", "defn": "AI가 관여한 평가, 진단, 배치, 징계가 학습의 실제 상태를 타당하게 반영하지 못하거나, 학생에게 낙인을 남기거나, 이의제기 기회를 줄이는 위험이다.", "ex": "AI 탐지기 오판에 따른 부정행위 처분; 자동 채점 오류; 오류 진단 고착"}, "ED8": {"side": "교육", "name": "교사 전문성과 교육 관계", "defn": "AI 때문에 교사의 전문적 판단·역할·교육 관계가 훼손되는 위험이다. 판단과 공동 숙의의 대체, 책임 전가나 책임 경로의 소실, 탈숙련, 교사에 대한 감시, 교사를 표적으로 한 AI 오용 피해(교원 딥페이크 등)가 여기에 든다. 교사가 가해자인 오용은 피해에 해당하는 범주와 의도적 오용 경로(P5)로 다루고, 기관의 관리 책임은 거버넌스 영역의 관리 항목에서 다룬다.", "ex": "교사 탈숙련; 책임 경로의 소실; 교사 판단과 공동 숙의의 대체"}, "ED9": {"side": "교육", "name": "교육 형평·접근·공공성", "defn": "AI 도입이 접근, 참여 기회, 자원 배분에서 구조적 격차를 키우거나, 언어·문화·장애에 따른 접근을 배제하거나, 교육과정·발달 시점과 어긋나거나, 서비스 종료·전환으로 학습이 끊기는 위험이다. 개별 평가·선발·처분 결정의 차별은 ED7(결과)과 TE3(집단 차이)으로 기록한다. 상업 목표의 학습 목표 침투는 ED10으로 기록한다.", " (function(){

function myCode(){

}
function download(name, text){

}

  }

const L4 = ['전혀 아니다','별로 아니다','대체로 그렇다','매우 그렇다','판단하기 어렵다'];
const radios = (name, opts, val, req) => `<div class="opts">${opts.map(o => `<label><input type="radio" name="${name}" value="${esc(o)}"${val===o?' checked':''}${req?' required':''}> ${esc(o)}</label>`).join('')}</div>`;
const checks = (name, opts, vals, max) => `<div class="opts"${max?` data-max="${max}"`:''}>${opts.map(([v,l]) => `<label><input type="checkbox" name="${name}" value="${esc(v)}"${(vals||[]).includes(v)?' checked':''}> ${esc(l)}</label>`).join('')}</div>`;
function readForm(form){
  const o = {};
  new FormData(form).forEach((v, k) => { o[k] = k in o ? [].concat(o[k], v) : v; });
  form.querySelectorAll('input[type=checkbox]').forEach(x => { if (!(x.name in o)) o[x.name] = []; else if (!Array.isArray(o[x.name])) o[x.name] = [o[x.name]]; });
  return o;
}
function limitChecks(form){
  form.querySelectorAll('.opts[data-max]').forEach(g => {
    const max = +g.dataset.max, boxes = [...g.querySelectorAll('input[type=checkbox]')];
    const upd = () => { const n = boxes.filter(b => b.checked).length; boxes.forEach(b => b.disabled = !b.checked && n >= max); };
    boxes.forEach(b => b.addEventListener('change', upd)); upd();
  });
}
const NOTICE = `<details class="card notice"><summary>참여·개인정보 안내</summary>
  <p>이 설문과 문제 제안은 「교육AI 위험관리 프레임워크」의 위험 범주와 위험 상황 사례를 보완하는 데 써요. 학생이나 참여 교사의 역량을 평가하지 않아요.</p>
  <p>이름, 이메일, 연락처, 학교명, 지역, 학생 정보는 받지 않아요. 서술하는 칸에도 자신이나 학생, 학교를 알아볼 수 있는 내용과 상세한 사건 경험은 적지 말아 주세요.</p>
  <p>참여는 자발적이며, 답하지 않은 문항이 있어도 불이익이 없어요. 이 화면에서 자동으로 만든 참여 코드가 응답과 함께 저장돼요. 응답 철회는 참여 코드를 연구 문의처로 보내 요청할 수 있어요.</p>
  <p>보관 기간, 저장 위치, 결과 공개 범위는 연구자가 정해 이 안내에 적어요.</p>
  <p>연구 문의·철회 요청: 임완철 · climtc@gnu.ac.kr</p></details>`;
const DRAFT = D.draft ? `<p class="draftnote">이 화면의 문항과 안내문은 연구자 확인 전 초안이에요.</p>` : '';
const EDs = Object.keys(D.riskdefs).filter(k => k.startsWith('ED'));
const consentBlock = v => `<fieldset><legend>참여 동의</legend><div class="qi"><p class="ql">안내를 읽고 자발적으로 참여하는 데 동의해요<span class="req">필수</span></p>${radios('consent',['동의함','동의하지 않음'],v,true)}</div></fieldset>`;

function survey(){
  const s = store.get('eair.survey') || {};
  const nQ = 1 + 4 + EDs.length * 2 + 4 + 1;
  $('#main').innerHTML = `<div class="eyebrow">교육AI 위험 연구 · 설문</div><h1>정상 작동해도 생기는 교육 측 문제</h1>${DRAFT}
  <p class="lede">이 연구는 AI가 고장 나지 않고 의도대로 작동하는데도 교육이 해를 입는 경우(경로 P2)를 가장 덜 채워진 자리로 보고 있어요. 지금까지 모은 관찰 사례 168건 가운데 P2는 12건이에요. 프레임워크의 교육 측 위험 10개 범주를 하나씩 보면서, 선생님 학교에서 생길 수 있는지 답해 주세요.</p>
  <p class="muted small">모두 ${nQ}문항이에요. 답한 내용은 이 브라우저에 임시로 남으니, 시간 날 때 조금씩 답하고 마지막에 보내 주셔도 돼요. 동료 선생님께 이 주소를 나누어 주셔도 좋아요. 사례 하나하나를 평정하는 설문은 <a href="education-ai-rmf-case-atlas.html">사례 검토</a>에 따로 있어요.</p>
  ${NOTICE}
  <form id="f" class="qform">${consentBlock(s.consent)}
    <fieldset><legend>배경</legend>
      <div class="qi"><p class="ql">학교급</p>${radios('bg_level',['유','초','중','고','특수','기타','해당 없음'],s.bg_level)}</div>
      <div class="qi"><p class="ql">교직 경력</p>${radios('bg_career',['5년 미만','5년 이상 10년 미만','10년 이상 20년 미만','20년 이상','교직 경력 없음'],s.bg_career)}</div>
      <div class="qi"><p class="ql">주 역할 <span class="muted small">여럿 고를 수 있어요</span></p>${checks('bg_role',['담임','교과','정보·AI 담당','학교 관리자','기타'].map(x=>[x,x]),s.bg_role)}</div>
      <div class="qi"><p class="ql">생성형 AI 활용 빈도</p>${radios('bg_ai',['거의 없음','학기에 몇 번','월 몇 번','주 1회 이상'],s.bg_ai)}</div></fieldset>
    <fieldset><legend>교육 측 위험 10개 범주</legend>${EDs.map((k, i) => { const r = D.riskdefs[k];
      return `<div class="qcard"><div class="eyebrow">${i+1} / ${EDs.length} · ${k}</div><h3>${esc(r.name)}</h3>
      <p class="small">${esc(r.defn)}</p><p class="small muted">예: ${esc(r.ex.replace(/; /g,', '))}</p>
      <div class="qi"><p class="ql">AI가 오류 없이 의도대로 작동해도, 이 문제가 내가 일하는 학교급에서 생길 수 있다</p>${radios(k+'_likely', L4, s[k+'_likely'])}</div>
      <div class="qi"><p class="ql">비슷한 장면을 직접 보거나 들은 적이 있다</p>${radios(k+'_seen', ['있다','없다','잘 모르겠다'], s[k+'_seen'])}</div></div>`; }).join('')}</fieldset>
    <fieldset><legend>알아채기와 대응</legend>
      <div class="qi"><p class="ql">AI가 정상 작동할 때 생기는 교육 측 문제를 우리 학교에서 알아챌 방법이 있다</p>${radios('b_notice', L4, s.b_notice)}</div>
      <div class="qi"><p class="ql">이런 문제를 알게 되면 학교 안에서 알리고 의논할 경로가 있다</p>${radios('b_route', L4, s.b_route)}</div>
      <div class="qi"><p class="ql">AI 도구를 고르거나 도입할 때 이런 문제를 확인해 본 적이 있다</p>${radios('b_adopt', ['있다','없다','도입·선정에 관여하지 않았다'], s.b_adopt)}</div>
      <div class="qi"><p class="ql">먼저 다루어야 할 범주를 세 개까지 골라 주세요</p>${checks('b_top3', EDs.map(k => [k, k + ' ' + D.riskdefs[k].name]), s.b_top3, 3)}</div></fieldset>
    <fieldset><legend>더 하고 싶은 말</legend>
      <div class="qi"><p class="ql">가장 걱정되는 장면이 있으면 짧게 적어 주세요 <span class="muted small">선택</span></p><textarea name="c_worry" rows="4" maxlength="2000">${esc(s.c_worry||'')}</textarea>
      <p class="muted small">장면을 자세히 적고 싶으면 <a href="education-ai-risk-ideas.html">문제 제안</a> 화면을 써 주세요.</p></div></fieldset>
    <div class="sticky-bar"><span id="prog" class="muted small"></span><span class="grow"></span><button class="btn" type="button" id="clear">지우고 처음부터</button><button class="btn primary" type="submit">설문 보내기</button></div>
    <div id="result"></div></form>`;
  const f = $('#f'); limitChecks(f);
  const names = [...new Set([...f.querySelectorAll('input[type=radio]')].map(x => x.name))];
  const prog = () => { const o = readForm(f); $('#prog').textContent = `객관식 ${names.filter(n => o[n]).length} / ${names.length} 답함 · 이 브라우저에 임시 저장됨`; store.set('eair.survey', o); };
  f.addEventListener('change', prog); f.addEventListener('input', prog); prog();
  $('#clear').onclick = () => { if (confirm('이 브라우저에 남은 설문 답을 지울까요?')) { store.del('eair.survey'); survey(); } };
  f.addEventListener('submit', async e => { e.preventDefault(); const o = readForm(f);
    if (o.consent !== '동의함') { $('#result').innerHTML = '<p class="warnbox">참여 동의에 ‘동의함’을 골라야 보낼 수 있어요.</p>'; return; }
    if (await submit('survey', o, $('#result'))) store.del('eair.survey'); });
}

function ideas(){
  const s = store.get('eair.idea') || {};
  const sent = store.get('eair.ideas.sent') || [];
  $('#main').innerHTML = `<div class="eyebrow">교육AI 위험 연구 · 주관식</div><h1>문제 제안</h1>${DRAFT}
  <p class="lede">교육 분야에 들어올 인공지능이 일으킬 문제를 찾아 주세요. 특히 <b>인공지능이 정상 작동하더라도 생길 교육 측면의 문제</b>에 집중해 주세요. 보내 주신 장면은 위험 상황 사례를 새로 만들거나 고치는 데 써요.</p>
  <div class="grid2">
    <div class="card"><h3>생각을 돕는 질문</h3><ul class="small">
      <li>AI가 정확하고 친절해서 오히려 학생이 스스로 해 볼 기회가 줄어드는 순간이 있나요?</li>
      <li>AI와 함께 낸 결과가 학생 혼자 할 수 있는 능력으로 읽히는 장면이 있나요?</li>
      <li>학생 말에 맞장구치는 AI가 판단이나 자기 이해를 흐리게 만들 때가 있나요?</li>
      <li>AI와의 대화가 친구, 선생님과 나누던 이야기를 대신하는 경우가 있나요?</li>
      <li>사용량이나 과제 완성률이 실제 배움의 증거처럼 쓰이는 일이 있나요?</li>
      <li>잘 맞춘 추천이 반복되면서 학생이 새 분야를 만날 기회가 줄어드나요?</li></ul></div>
    <div class="card"><h3>이미 정리된 P2 사례 ${D.p2count}개</h3>
      <p class="small">비슷한 장면이 있는지 먼저 살펴보면 좋아요. 같은 장면이라도 학교급이나 상황이 다르면 새로 적어 주세요.</p>
      <ul class="small">${D.examples.map(c => `<li><a href="${RMF}#${encodeURIComponent(c.anchor)}">${c.id} ${esc(c.title)}</a></li>`).join('')}</ul>
      <p class="small"><a href="${RMF}#cases?path=P2">P2 사례 모두 보기</a></p></div>
  </div>
  ${NOTICE}
  <form id="f" class="qform">${consentBlock(s.consent)}
    <fieldset><legend>장면</legend>
      <div class="qi"><label class="ql" for="i_title">제목 <span class="muted small">선택</span></label><input type="text" id="i_title" name="title" maxlength="120" value="${esc(s.title||'')}" placeholder="예: 맞춤 추천이 반복되며 관심 분야가 좁아짐"></div>
      <div class="qi"><label class="ql" for="i_scene">어떤 장면인가요?<span class="req">필수</span></label><p class="hint">누가, 어떤 AI를, 어떤 수업이나 활동에서 쓰는지 적어 주세요.</p><textarea id="i_scene" name="scene" rows="5" maxlength="3000" required>${esc(s.scene||'')}</textarea></div>
      <div class="qi"><p class="ql">그 장면에서 AI는 어떻게 작동했나요?</p>${radios('ai_state',['오류 없이 의도대로 작동했다','오류나 결함이 있었다','잘 모르겠다'],s.ai_state)}</div>
      <div class="qi"><label class="ql" for="i_problem">무엇이 문제인가요?<span class="req">필수</span></label><p class="hint">학생의 배움, 관계, 권리, 교사의 판단 가운데 무엇이 어떻게 해를 입는지 적어 주세요.</p><textarea id="i_problem" name="problem" rows="5" maxlength="3000" required>${esc(s.problem||'')}</textarea></div></fieldset>
    <fieldset><legend>알아채기와 대응 <span class="muted small">선택</span></legend>
      <div class="qi"><label class="ql" for="i_signal">학교에서 알아챌 수 있는 신호</label><textarea id="i_signal" name="signal" rows="3" maxlength="2000">${esc(s.signal||'')}</textarea></div>
      <div class="qi"><label class="ql" for="i_action">교사나 학교가 할 수 있는 일</label><textarea id="i_action" name="action" rows="3" maxlength="2000">${esc(s.action||'')}</textarea></div>
      <div class="qi"><label class="ql" for="i_ask">도입·선정 때 공급자에게 물어볼 것</label><textarea id="i_ask" name="ask" rows="2" maxlength="1500">${esc(s.ask||'')}</textarea></div></fieldset>
    <fieldset><legend>분류 <span class="muted small">선택, 잘 모르면 비워 두세요</span></legend>
      <div class="qi"><p class="ql">가까운 교육 측 위험 범주</p>${checks('ed', EDs.map(k => [k, k + ' ' + D.riskdefs[k].name]), s.ed)}</div>
      <div class="qi"><p class="ql">학교급</p>${checks('level', ['유','초 저학년','초 고학년','중','고','특수','대학'].map(x=>[x,x]), s.level)}</div>
      <div class="qi"><p class="ql">사용 맥락</p>${checks('ctx', Object.keys(D.ctx).map(k => [k, D.ctx[k]]), s.ctx)}</div>
      <div class="qi"><p class="ql">이 장면은</p>${radios('origin',['직접 보거나 겪은 일과 비슷하다','들은 일과 비슷하다','생각해 본 가정 상황이다'],s.origin)}</div></fieldset>
    <div class="sticky-bar"><span id="prog" class="muted small"></span><span class="grow"></span><button class="btn" type="button" id="clear">지우기</button><button class="btn primary" type="submit">제안 보내기</button></div>
    <div id="result"></div></form>
  ${sent.length ? `<h2>이 브라우저에서 보낸 제안 ${sent.length}개</h2><ul class="small">${sent.map(x => `<li>${esc(x.t)} <span class="muted">${esc(x.d)}</span></li>`).join('')}</ul>` : ''}
  <p class="muted small">제안은 몇 개든 보낼 수 있어요. 하나를 보내면 칸이 비워지고 다음 장면을 적을 수 있어요.</p>`;
  const f = $('#f');
  const save = () => { store.set('eair.idea', readForm(f)); $('#prog').textContent = '적은 내용이 이 브라우저에 임시 저장됨'; };
  f.addEventListener('input', save); f.addEventListener('change', save);
  $('#clear').onclick = () => { if (confirm('적은 내용을 지울까요?')) { store.del('eair.idea'); ideas(); } };
  f.addEventListener('submit', async e => { e.preventDefault(); const o = readForm(f);
    if (o.consent !== '동의함') { $('#result').innerHTML = '<p class="warnbox">참여 동의에 ‘동의함’을 골라야 보낼 수 있어요.</p>'; return; }
    if (await submit('idea', o, $('#result'))) {
      const list = store.get('eair.ideas.sent') || []; list.push({t: o.title || o.scene.slice(0, 40) + '…', d: new Date().toLocaleString('ko-KR')});
      store.set('eair.ideas.sent', list); store.set('eair.idea', {consent: o.consent});
      setTimeout(() => { ideas(); window.scrollTo(0, 0); }, 2500); } });
}
(D.page === 'survey' ? survey : ideas)();
const tb = $('#theme'); if (tb) tb.addEventListener('click', () => { const r = document.documentElement; const cur = r.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme', dark ? 'light' : 'dark'); });
})();
</script>
</body>
</html>
